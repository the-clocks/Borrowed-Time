<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Möbius Strip Clock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=block"
    rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at center, #e39dd8 0%, #ffee69 100%);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
    }

    .date-container,
    .title-container {
      position: fixed;
      width: 98vw;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      padding: 0 2vw;
      z-index: 10;
      color: #743c3c;
    }

    .date-container {
      bottom: 0.5vh;
    }

    .title-container {
      top: 0.5vh;
      color: #dcabab;
      text-shadow: #343432 0.1vw 0px;
    }

    .clockname {
      font-family: "Oxanium", serif;
      font-size: 1.2rem;
      line-height: 4vh;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 1rem;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      font-family: "Oxanium", serif;
      font-size: 1rem;
      font-style: italic;
      letter-spacing: -0.1vh;
    }

    .dateleft,
    .dateright {
      font-family: "Nanum Gothic Coding", monospace;
      font-size: 1rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }
  </style>
</head>
<body>
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../ascii/" class="dates dateleft">07/15/25</a>
    <a href="../index.html" class="clockname">Möbius Strip</a>
    <a href="../animals/" class="dates dateright">07/17/25</a>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const clockCanvas = document.createElement('canvas');
    clockCanvas.width = 512;
    clockCanvas.height = 128;
    const clockContext = clockCanvas.getContext('2d');

    const clockTexture = new THREE.CanvasTexture(clockCanvas);
    clockTexture.minFilter = THREE.LinearFilter;
    clockTexture.wrapS = THREE.RepeatWrapping;
    clockTexture.wrapT = THREE.RepeatWrapping;

    const geometry = new THREE.ParametricGeometry((u, v, target) => {
      const r = 1;
      const w = 0.2;
      const theta = u * Math.PI * 2;
      const t = v * 2 - 1;
      const x = (r + w * t * Math.cos(theta / 2)) * Math.cos(theta);
      const y = (r + w * t * Math.cos(theta / 2)) * Math.sin(theta);
      const z = w * t * Math.sin(theta / 2);
      target.set(x, y, z);
    }, 100, 20);

    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: clockTexture,
      side: THREE.DoubleSide,
      metalness: 0.2,
      roughness: 0.3,
    });

    const mobius = new THREE.Mesh(geometry, material);
    scene.add(mobius);

    scene.add(new THREE.AmbientLight(0x404040));
    const pointLight = new THREE.PointLight(0xffffff, 1.2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    camera.position.z = 3;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    let lastMinute = null;
    let timeString = '';

    function updateClockTexture() {
      const now = new Date();
      const currentMinute = now.getMinutes();
      let currentHour = now.getHours();

      const ampm = currentHour >= 12 ? 'PM' : 'AM';
      currentHour = currentHour % 12 || 12;

      if (currentMinute !== lastMinute) {
        lastMinute = currentMinute;
        const hourStr = currentHour.toString();
        const minuteStr = currentMinute.toString().padStart(2, '0');
        timeString = `${hourStr}:${minuteStr} ${ampm}`;
      }

      clockContext.clearRect(0, 0, clockCanvas.width, clockCanvas.height);

      clockContext.fillStyle = 'rgba(255, 255, 255, 0.6)';
      clockContext.fillRect(0, 0, clockCanvas.width, clockCanvas.height);

      const fontSize = Math.round(clockCanvas.width / 4.5);
      clockContext.font = `${fontSize}px Georgia`;
      clockContext.fillStyle = '#000000';
      clockContext.textBaseline = 'middle';
      clockContext.textAlign = 'left';

      clockContext.fillText(timeString, 10, clockCanvas.height / 2);
      clockTexture.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);

      mobius.rotation.x += 0.003;
      mobius.rotation.y += 0.005;
      mobius.rotation.z += 0.002;

      controls.update();
      updateClockTexture();

      clockTexture.offset.x -= 0.002;
      if (clockTexture.offset.x < -1) {
        clockTexture.offset.x += 1;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
