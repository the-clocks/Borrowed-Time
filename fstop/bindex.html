<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>f Stop Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #1c1b1b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .clock {
      z-index: 8;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      position: relative;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background: linear-gradient(
        to top,
        #cccccc 0%,
        #eeeeee 25%,
        #aaaaaa 50%,
        #ffffff 75%,
        #888888 100%
      );
      box-shadow: 0 0 0.2rem rgba(255, 255, 255, 0.6),
                  0 0 0.5rem rgba(0, 0, 0, 0.3) inset;
      border: 0.05rem solid #ccc;
      border-radius: 0.2rem;
    }

    .hour {
      width: 6px;
      height: 80px;
      transform: rotate(0deg);
    }

    .minute {
      width: 4px;
      height: 140px;
      transform: rotate(0deg);
    }

    .second {
      width: 2px;
      height: 190px;
      transform: rotate(0deg);
    }

    .clock-numbers {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      font-family: 'Roboto Slab', serif;
      color: #eaeaea;
    }

    .clock-numbers .number {
      position: absolute;
      width: 2rem;
      height: 2rem;
      text-align: center;
      line-height: 2rem;
      font-size: 1.2rem;
      transform: rotate(calc(var(--i) * 30deg)) translateY(-70px) rotate(calc(var(--i) * -30deg));
      left: 50%;
      top: 50%;
      transform-origin: center;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }

    .date-container {
      color: #efeaca;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }

    .dateleft, .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }

    .dateleft {
      position: relative;
      left: 0;
    }

    .dateright {
      position: absolute;
      right: 0;
    }

    .title-container {
      color: #114b81;
      text-shadow: #d3d0d1 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }

    .bgimage, .bgimage2, .bgimage3, .bgimage4 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: brightness(120%);
    }

    .bgimage {
      z-index: 2;
      opacity: 0.5;
    }

    .bgimage2 {
      z-index: 1;
    }

    .bgimage3 {
      z-index: 3;
      opacity: 0.4;
    }

    .bgimage4 {
      width: 109vw;
      z-index: 4;
      opacity: 0.2;
    }
  </style>
</head>

<body>
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../thoughtballoon/" class="dates dateleft">06/24/25</a>
    <a href="../index.html" class="clockname">f Stop</a>
    <a href="../cosmicwheels/" class="dates dateright">06/26/25</a>
  </div>

  <img src="./camer.webp" class="bgimage4">
  <img src="./ca.webp"  class="bgimage3"> 
  <img src="./cam.webp" class="bgimage"> 
  <img src="./camr.webp" class="bgimage2"> 

  <div class="clock">
    <!-- Clock Numbers -->
    <div class="clock-numbers">
      <div class="number" style="--i:1">1</div>
      <div class="number" style="--i:2">2</div>
      <div class="number" style="--i:3">3</div>
      <div class="number" style="--i:4">4</div>
      <div class="number" style="--i:5">5</div>
      <div class="number" style="--i:6">6</div>
      <div class="number" style="--i:7">7</div>
      <div class="number" style="--i:8">8</div>
      <div class="number" style="--i:9">9</div>
      <div class="number" style="--i:10">10</div>
      <div class="number" style="--i:11">11</div>
      <div class="number" style="--i:12">12</div>
    </div>

    <!-- Clock Hands -->
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
  </div>

  <script>
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');

    function updateClock() {
      const now = new Date();
      const sec = now.getSeconds();
      const min = now.getMinutes();
      const hr = now.getHours() % 12;

      const secDeg = sec * 6;
      const minDeg = min * 6 + sec * 0.1;
      const hrDeg = hr * 30 + min * 0.5;

      secondHand.style.transform = `rotate(${secDeg}deg)`;
      minuteHand.style.transform = `rotate(${minDeg}deg)`;
      hourHand.style.transform = `rotate(${hrDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
