<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <title>f-Stop Clock</title>
  <style>
    :root {
      font-size: 2vh;
    }

      @font-face {
            font-family: 'cam';
            src: url('cam.otf') format('opentype');
        }

    body {
      margin: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
 
    }

    .clock {
      z-index: 9;
      width: 80vw;
      height: 80vw;
      max-height: 80vh;
      max-width: 80vh;
      border-radius: 50%;
      position: relative;
       opacity: 0.6;
    }

  .number {
  font-family: 'cam';
  position: absolute;
  color: #fff;
  font-size: 2rem;
  transform: translate(-50%, -50%);
  /* opacity: 0.6; */
  
  /* Shiny silver text style */
  background: linear-gradient(135deg, #e0e0e0 0%, #f8f8f8 20%, #b0b0b0 50%, #f0f0f0 80%, #d0d0d0 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-fill-color: transparent;

  /* subtle glow for metallic effect */
  text-shadow:
    0 0 5px #ffffffaa,
    0 0 10px #ccccccaa,
    0 0 15px #bbbbbbaa;
}


    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background: linear-gradient(
        to top,
        #cccccc 0%,
        #eeeeee 25%,
        #8d8b8b 50%,
        #ffffff 75%,
        #888888 100%
      );
      border-radius: 0.3rem;
    }

    .hour {
      width: 1rem;
      height: 20%;
    }

    .minute {
      width: 0.7rem;
      height: 30%;
      background: #ccc;
    }

    .second {
      width: 0.3rem;
      height: 40%;
    }

    .center {
      position: absolute;
      width: 2rem;
      height: 2rem;
      background: #fff;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }

    .date-container {
      color: #efeaca;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }

    .dateleft, .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }

    .dateleft {
      position: relative;
      left: 0;
    }

    .dateright {
      position: absolute;
      right: 0;
    }

    .title-container {
      color: #114b81;
      text-shadow: #d3d0d1 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }

    .bgimage, .bgimage2, .bgimage3, .bgimage4 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      filter: brightness(120%);
    }

    .bgimage {
      z-index: 2;
      opacity: 0.5;
    }

    .bgimage2 {
      z-index: 1;
    }

    .bgimage3 {
      z-index: 3;
      opacity: 0.4;
    }

    .bgimage4 {
      width: 104vw;
      z-index: 4;
      opacity: 0.2;
    }
  </style>
</head>

<body>
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../cuneiform/" class="dates dateleft">07/19/25</a>
    <a href="../index.html" class="clockname">f-Stop</a>
   <a href="../index.html" class="dates dateright">07/21/25</a>
  </div>

  <img src="./camer.webp" class="bgimage4">
  <img src="./ca.webp"  class="bgimage3"> 
  <img src="./cam.webp" class="bgimage"> 
  <img src="./camr.webp" class="bgimage2"> 

  <div class="clock">
    <div class="center"></div>

    <!-- Clock Numbers -->
    <script>
      const clock = document.querySelector('.clock');
      for (let i = 1; i <= 12; i++) {
        const angle = (i / 12) * 2 * Math.PI;
        const x = 50 + 42 * Math.sin(angle);
        const y = 50 - 42 * Math.cos(angle);
        const num = document.createElement('div');
        num.className = 'number';
        num.style.left = `${x}%`;
        num.style.top = `${y}%`;
       const customDigits = ['f/1.0', 'f/1.4', 'f/2.0', 'f/2.8', 'f/4.0', 'f/5.6', 'f/8.0', 'f/11', 'f/16', 'f/22', 'f/32', 'f/45'];
num.textContent = customDigits[i - 1];

        clock.appendChild(num);
      }
    </script>

    <!-- Clock Hands -->
    <div class="hand hour" id="hourHand"></div>
    <div class="hand minute" id="minuteHand"></div>
    <div class="hand second" id="secondHand"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const sec = now.getSeconds();
      const min = now.getMinutes();
      const hr = now.getHours() % 12;

      document.getElementById('hourHand').style.transform = `rotate(${(hr + min / 60) * 30}deg)`;
      document.getElementById('minuteHand').style.transform = `rotate(${(min + sec / 60) * 6}deg)`;
      document.getElementById('secondHand').style.transform = `rotate(${sec * 6}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
