<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Clock Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #7e5554, #3a0808);
            perspective: 800px;
            overflow: hidden;
        }
        .stage {
            width: 100%;
            height: 30%; /* Adjusted for less intrusion */
            position: absolute;
            bottom: 0;
            background: linear-gradient(to top, #f1cd72, #704e20);
            transform: rotateX(60deg);
            transform-origin: bottom;
            box-shadow: 0 -10px 20px rgba(0, 4, 12, 0.5);
        }
        .clock-container {
            position: relative;
            width: 400px;
            height: 400px;
            transform: rotateX(-30deg); /* Centered, only 3D rotation */
            z-index: 1;
        }
        .clock {
            width: 100%;
            height: 100%;
            background: #786e6e;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 0, 0, 0.5);
            border: 10px solid #4a2a2a;
        }
        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 24px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .number1 { transform: rotate(30deg); }
        .number2 { transform: rotate(60deg); }
        .number3 { transform: rotate(90deg); }
        .number4 { transform: rotate(120deg); }
        .number5 { transform: rotate(150deg); }
        .number6 { transform: rotate(180deg); }
        .number7 { transform: rotate(210deg); }
        .number8 { transform: rotate(240deg); }
        .number9 { transform: rotate(270deg); }
        .number10 { transform: rotate(300deg); }
        .number11 { transform: rotate(330deg); }
        .number12 { transform: rotate(0deg); }
        .number div {
            position: absolute;
            width: 100%;
            top: 10px;
            transform: rotate(-30deg);
        }
        .number1 div { transform: rotate(-30deg); }
        .number2 div { transform: rotate(-60deg); }
        .number3 div { transform: rotate(-90deg); }
        .number4 div { transform: rotate(-120deg); }
        .number5 div { transform: rotate(-150deg); }
        .number6 div { transform: rotate(-180deg); }
        .number7 div { transform: rotate(-210deg); }
        .number8 div { transform: rotate(-240deg); }
        .number9 div { transform: rotate(-270deg); }
        .number10 div { transform: rotate(-300deg); }
        .number11 div { transform: rotate(-330deg); }
        .number12 div { transform: rotate(0deg); }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 5px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="200"><defs><pattern id="filigree" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M5,0 C6,2 4,4 5,5 C6,6 8,6 8,8 C6,8 4,10 5,10" stroke="#d4af37" stroke-width="1" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(#filigree)"/></svg>'), #d4af37;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        .hour-hand {
            width: 8px;
            height: 120px;
            transform: translateX(-50%);
        }
        .minute-hand {
            width: 6px;
            height: 160px;
            transform: translateX(-50%);
        }
        .second-hand {
            width: 3px;
            height: 180px;
            transform: translateX(-50%);
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="6" height="200"><defs><pattern id="filigree" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M3,0 C4,1 2,3 3,3 C4,3 5,4 5,5" stroke="#d4af37" stroke-width="0.5" fill="none"/></pattern></defs><rect width="100%" height="100%" fill="url(#filigree)"/></svg>'), #d4af37;
        }
        .center {
            width: 20px;
            height: 20px;
            background: #d4af37;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="stage"></div>
    <div class="clock-container">
        <div class="clock">
            <div class="clock-face">
                <div class="number number1"><div>1</div></div>
                <div class="number number2"><div>2</div></div>
                <div class="number number3"><div>3</div></div>
                <div class="number number4"><div>4</div></div>
                <div class="number number5"><div>5</div></div>
                <div class="number number6"><div>6</div></div>
                <div class="number number7"><div>7</div></div>
                <div class="number number8"><div>8</div></div>
                <div class="number number9"><div>9</div></div>
                <div class="number number10"><div>10</div></div>
                <div class="number number11"><div>11</div></div>
                <div class="number number12"><div>12</div></div>
                <div class="hand hour-hand"></div>
                <div class="hand minute-hand"></div>
                <div class="hand second-hand"></div>
                <div class="center"></div>
            </div>
        </div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const hourDeg = (hours * 30) + (minutes * 0.5);
            const minuteDeg = minutes * 6;
            const secondDeg = seconds * 6;

            document.querySelector('.hour-hand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
            document.querySelector('.minute-hand').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            document.querySelector('.second-hand').style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;

            requestAnimationFrame(updateClock);
        }

        updateClock();
    </script>
</body>
</html>
