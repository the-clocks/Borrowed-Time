<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kaleidoscope</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
    }

    .kaleidoscope {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 1000px;
    }

    .segment {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30vmin;
      height: 30vmin;
      transform-origin: center;
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Kaleidoscope_image.jpg/800px-Kaleidoscope_image.jpg') no-repeat center/cover;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      opacity: 0.8;
      animation: spin 20s linear infinite;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
    }
  </style>
</head>
<body>
  <div class="kaleidoscope" id="kaleidoscope"></div>

  <script>
    const container = document.getElementById('kaleidoscope');
    const SEGMENTS = 12;

    for (let i = 0; i < SEGMENTS; i++) {
      const seg = document.createElement('div');
      seg.className = 'segment';
      seg.style.transform = `translate(-50%, -50%) rotate(${(360 / SEGMENTS) * i}deg)`;
      container.appendChild(seg);
    }
  </script>
</body>
</html>
