<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretch Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
       @font-face {
      font-family: 'stretch';
      src: url('./stretch.ttf') format('truetype');
    }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #clock {
            background-image: repeating-linear-gradient(335deg, #07bb4f 0, #e51a8a 0.2px, transparent 0, transparent 50%);
            background-size: 11px 11px;
            background-color: #bbcdc4;
                 font-size: 4rem;
            position: relative;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .time-unit {
            font-family: 'stretch';
            position: absolute;
                 font-size: 7rem;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            text-align: center;
            line-height: 1;
            opacity: 0; /* Default opacity */
        }
        #hours {
            width: 100%;
            height: 100%;
            color: #090213;
       
            z-index: 1;
            opacity: 1; /* Make hours visible */
        }
        #minutes {
            width: 100%;
            height: 100%;
            color: #76f705;
   
            z-index: 2;
            opacity: 0.8;
        }
        #seconds {
            width: 100%;
            height: 100%;
            color: #eefa03;
  
            z-index: 3;
            opacity: 0.6;
        }
        .time-unit span {
            display: block;
            width: 100%;
            height: 100%;
            transform: scale(3.5, 2) skew(40deg);
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
        }
        .morph {
            animation: morph 0.5s ease-in-out;
        }
        @keyframes morph {
            0% {
                transform: scale(3.5, 2) skew(40deg) rotateX(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(3.0, 1.5) skew(20deg) rotateX(45deg);
                opacity: 0.5;
            }
            100% {
                transform: scale(3.5, 2) skew(40deg) rotateX(0deg);
                opacity: 1;
            }
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
        }

        .date-container {
            color: #044303;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .clockname {
            font-family: "Oxanium", serif;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft,
        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
        }

        .dateleft {
            position: relative;
            left: 0;
        }

        .dateright {
            position: absolute;
            right: 0;
        }

        .title-container {
            color: #daddda;
            text-shadow: #2c4f02 1px 0px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.1vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.2vh;
            font-style: italic;
            letter-spacing: -0.1vh;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>
    <div class="date-container">
        <a href="../twentyfour/" class="dates dateleft">06/28/25</a>
        <a href="../index.html" class="clockname">Stretch</a>
        <a href="../eggs/" class="dates dateright">06/30/25</a>
    </div>
    <div id="clock">
        <div id="hours" class="time-unit"><span>0</span></div>
        <div id="minutes" class="time-unit"><span>0</span></div>
        <div id="seconds" class="time-unit"><span>0</span></div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            hours = hours % 12 || 12; // Convert to 12-hour format, use 12 instead of 0
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            
            const hoursSpan = document.getElementById('hours').querySelector('span');
            const minutesSpan = document.getElementById('minutes').querySelector('span');
            const secondsSpan = document.getElementById('seconds').querySelector('span');
            
            // Format minutes with leading zeros
            const formattedMinutes = minutes.toString().padStart(2, '0');
            
            // Trigger morph animation only if the value changes
            if (hoursSpan.textContent !== hours.toString()) {
                hoursSpan.classList.add('morph');
                hoursSpan.textContent = hours;
            }
            if (minutesSpan.textContent !== formattedMinutes) {
                minutesSpan.classList.add('morph');
                minutesSpan.textContent = formattedMinutes;
            }
            if (secondsSpan.textContent !== seconds.toString()) {
                secondsSpan.classList.add('morph');
                secondsSpan.textContent = seconds;
            }
            
            // Remove the morph class after animation completes to allow re-triggering
            setTimeout(() => {
                hoursSpan.classList.remove('morph');
                minutesSpan.classList.remove('morph');
                secondsSpan.classList.remove('morph');
            }, 500); // Matches animation duration
        }
        updateClock();
        setInterval(updateClock, 1000); // Update every second since milliseconds are removed
    </script>
</body>
</html>
