<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
      
      @font-face {
      font-family: 'squ';
      src: url('./squ.ttf') format('truetype');
    }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
            background-color: #1c3f8a;
            color:  #1c3f8a;
            font-size: 3rem;
        }

        .clock {
            z-index: 1;
            display: flex;
            align-items: center;
        }

        .digit {
            font-family: 'squ';
            width: 1ch;
            text-align: center;
        }
        .bgImage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: contrast(100%);
            z-index: 1;
            /* opacity: 0.5; */
            filter: alpha(opacity=50);
            pointer-events: none;
        }
    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }

    .date-container {
      color: rgb(184, 244, 172);
      position: absolute;
      bottom: 1vh;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }

    .dateleft,
    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }

    .dateleft {
      position: relative;
      left: 0;
    }

    .dateright {
      position: absolute;
      right: 0;
    }

    .title-container {
      color: #b8cb9d;
      text-shadow: #201e1f 0.1vh 0;
      position: absolute;
      top: 0.5vh;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.1vh;
      position: absolute;
      top: 0.5vh;
      right: 1vh;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.7vh;
      font-style: italic;
      letter-spacing: -0.1vh;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../parallel/" class="dates dateleft">06/23/25</a>
    <a href="../index.html" class="clockname">Thought Balloon</a>
     <a href="../index.html"  class="dates dateright">06/25/25</a>
  </div>
    <img src="./tho.webp" class="bgImage">    
     <div class="clock">
        <div class="digit" id="hourTens">0</div>
        <div class="digit" id="hourUnits">0</div>
        <span>:</span>
        <div class="digit" id="minuteTens">0</div>
        <div class="digit" id="minuteUnits">0</div>
        <span>:</span>
        <div class="digit" id="secondTens">0</div>
        <div class="digit" id="secondUnits">0</div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2);
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            // Extract digits
            const hourTens = hours[0];
            const hourUnits = hours[1];
            const minuteTens = minutes[0];
            const minuteUnits = minutes[1];
            const secondTens = seconds[0];
            const secondUnits = seconds[1];

            // Update the clock display
            document.getElementById('hourTens').textContent = hourTens;
            document.getElementById('hourUnits').textContent = hourUnits;
            document.getElementById('minuteTens').textContent = minuteTens;
            document.getElementById('minuteUnits').textContent = minuteUnits;
            document.getElementById('secondTens').textContent = secondTens;
            document.getElementById('secondUnits').textContent = secondUnits;
        }

        // Update the clock every second
        setInterval(updateClock, 1000);

        // Initialize the clock immediately
        updateClock();
    </script>
</body>

</html>
