<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <title>Analog Clock with Image Hands</title>
  <style>
    @font-face {
      font-family: 'bone';
      src: url('./bone.ttf') format('truetype');
    }

    html {
      /* font-size: 16px; */
    }

    body {
      margin: 0;
      background: #757272;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .clock {
      position: relative;
      width: 28em; /* 300px */
      height: 28rem;
      border-radius: 50%;
      z-index: 5;
    }

    .clock::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .hand-img {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      pointer-events: none;
    }

    #hour {
      height: 5rem; /* 70px */
      z-index: 3;
    }

    #minute {
      height: 10rem; /* 100px */
      z-index: 2;
    }

    #second {
      height: 14rem; /* 120px */
      filter: brightness(0.8) contrast(1.3);
      z-index: 1;
    }

    .number-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }

    .number-container span {
      position: absolute;
      font-family: 'bone', sans-serif;
      font-size: 5.5rem;
      color: rgb(223, 213, 187);
      text-shadow: #1b1b1a 1px 1px 0px,  #141412  -1px -1px 0px;;
      transform: translate(-50%, -50%);
    }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
            text-decoration: none;
        }

        .date-container {
            color: #efeaca;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .clockname {
            font-family: "Oxanium", serif;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Oxanium", serif;
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: relative;
            left: 0;
        }

        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: absolute;
            right: 0;
        }

        .title-container {
            color: #114b81;
            text-shadow: #d3d0d1 1px 0px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            /* justify-content: space-between; */
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.8vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.8vh;
            font-style: italic;
            z-index: 15;
            letter-spacing: -0.1vh;
        }

     .bgImage {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 200vw;
  height: 100vh;
  z-index: 0;
  filter: brightness(120%);
  /* transform: scaleX(-1); */
}

    </style>
</head>

<body>
    <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>
  <div class="date-container">
    <a href="../thoughtballoon/" class="dates dateleft">06/24/25</a>
    <a href="../index.html" class="clockname">Bone</a>
    <a href="../index.html" class="dates dateright">06/26/25</a>
  </div>
    <img src="./bon.png" class="bgImage"> 
  <div class="clock">
    <!-- Image Hands -->
    <img src="./bone2.png" class="hand-img" id="hour" alt="hour hand">
    <img src="./bone1.png" class="hand-img" id="minute" alt="minute hand">
    <img src="./bone.png" class="hand-img" id="second" alt="second hand">

    <!-- Clock Numbers -->
    <div class="number-container"></div>
  </div>

  <script>
    const hourHand = document.getElementById('hour');
    const minuteHand = document.getElementById('minute');
    const secondHand = document.getElementById('second');

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secondDeg = seconds * 6;
      const minuteDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = (hours % 12) * 30 + minutes * 0.5;

      secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
    }

    function placeClockNumbers() {
      const numberContainer = document.querySelector('.number-container');
      const radius = 45; // as percentage of clock size

      for (let i = 1; i <= 12; i++) {
        const angle = (i - 3) * 30 * (Math.PI / 180); // offset to align 12 at top
        const x = 50 + radius * Math.cos(angle);
        const y = 50 + radius * Math.sin(angle);

        const span = document.createElement('span');
        span.textContent = i;
        span.style.left = `${x}%`;
        span.style.top = `${y}%`;
        numberContainer.appendChild(span);
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
    placeClockNumbers();
  </script>
</body>
</html>
