<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Clock with Numbers</title>
  <style>
    @font-face {
        font-family: 'bak';
        src: url('./bak.ttf') format('truetype');  /* Adjust the path to your font file */
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-size: 16px; /* Base font size for REM calculations */
    }
    .clock {
      width: 20rem;
      height: 20rem;
      border: 0.5rem solid #333;
      border-radius: 50%;
      position: relative;
      background: white;
      box-shadow: 0 0 1rem rgba(0, 0, 0, 0.2);
    }
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      background: black;
    }
    .hour-hand {
      width: 0.4rem;
      height: 6rem;
      background: #333;
    }
    .minute-hand {
      width: 0.3rem;
      height: 8rem;
      background: #666;
    }
    .second-hand {
      width: 0.2rem;
      height: 9rem;
      background: red;
    }
    .center {
      width: 1rem;
      height: 1rem;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .number {
      position: absolute;
      font-size: 1.5rem;
      font-family: 'bak', sans-serif;
      text-align: center;
      width: 2rem;
      height: 2rem;
      line-height: 2rem;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="clock">
    <div class="hand hour-hand"></div>
    <div class="hand minute-hand"></div>
    <div class="hand second-hand"></div>
    <div class="center"></div>
    <div class="number" style="top: 10%; left: 50%;">12</div>
    <div class="number" style="top: 15.86%; left: 74.13%;">1</div>
    <div class="number" style="top: 30.86%; left: 85.86%;">2</div>
    <div class="number" style="top: 50%; left: 90%;">3</div>
    <div class="number" style="top: 69.14%; left: 85.86%;">4</div>
    <div class="number" style="top: 84.14%; left: 74.13%;">5</div>
    <div class="number" style="top: 90%; left: 50%;">6</div>
    <div class="number" style="top: 84.14%; left: 25.87%;">7</div>
    <div class="number" style="top: 69.14%; left: 14.14%;">8</div>
    <div class="number" style="top: 50%; left: 10%;">9</div>
    <div class="number" style="top: 30.86%; left: 14.14%;">10</div>
    <div class="number" style="top: 15.86%; left: 25.87%;">11</div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      const secondDeg = (seconds / 60) * 360;
      const minuteDeg = (minutes / 60) * 360 + (seconds / 60) * 6;
      const hourDeg = (hours / 12) * 360 + (minutes / 60) * 30;

      document.querySelector('.second-hand').style.transform = `rotate(${secondDeg}deg)`;
      document.querySelector('.minute-hand').style.transform = `rotate(${minuteDeg}deg)`;
      document.querySelector('.hour-hand').style.transform = `rotate(${hourDeg}deg)`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
