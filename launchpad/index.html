<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>24-Hour Clock with Background</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&family=Rock+3D&display=swap"
        rel="stylesheet">
 <style>
    @font-face {
        font-family: 'rock';
        src: url('./rock.ttf') format('truetype');
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url('./rocket.gif') no-repeat center center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;

    }
    #clock {
      font-family: 'rock';
      color: rgb(255, 0, 47);
      font-size: 1.8rem;
      background: rgba(0, 0, 0, 0.6); /* optional: semi-transparent box behind clock */
      padding: 0.7rem 0.7rem;
      border-radius: 1rem;
    }

    .title-container {
      color: #f6c410;
      text-shadow: #4e4d4d 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }
    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
      text-decoration: none;
    }
    .date-container {
      color: #d5cfcf;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }
    .dateleft, .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }
    .dateleft { left: 0; position: relative; }
    .dateright { right: 0; position: absolute; }
    .divider {
      height: 1px;
      width: 30vw;
      background-color: rgb(52, 1, 77);
      margin: 0 auto;
    }
  </style>
</head>
<body>
   <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>

    <div class="date-container">
        <a href="../backwards/" class="dates dateleft">07/02/25</a>
        <a href="../index.html" class="clockname">Launchpad</a>
        <a href="../kal" class="dates dateright">07/04/25</a>
    </div>
  <div id="clock"></div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');
      const ms = now.getMilliseconds().toString().padStart(3, '0');
      document.getElementById('clock').textContent = `T-${h}:${m}:${s}.${ms}`;
      requestAnimationFrame(updateClock);
    }

    requestAnimationFrame(updateClock);
  </script>
</body>
</html>
