<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vegas Clock - BorrowedTime</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Permanent+Marker&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'vegas';
      src: url('vegas.ttf') format('truetype');
    }

    iframe {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    .wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: 100vw;
      z-index: 10;
    }

    .clock-container {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 1vmin;
      white-space: nowrap;
      max-width: 100vw;
      overflow: hidden;
    }

    .digit-group {
      font-family: 'vegas', sans-serif;
      display: flex;
      gap: 0.1vmin;
    }

    .digit-box {
      color: #edcb0b;
      text-shadow: #c406fe 0px 2px, #f84802 0px -2px, #48d9e9 2px 0px, #f84802 -2px 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3.5rem;
      width: 1rem;
      height: 4rem;
      min-width: 2.2rem;
      text-align: center;
      box-sizing: border-box;
      z-index: 19;
    }

    .digit-box:empty {
      visibility: hidden;
    }

    /* Flicker animations for 0.15s duration */
    .flicker-015-a {
      animation: flicker015a 0.15s 1;
    }

    @keyframes flicker015a {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .flicker-015-b {
      animation: flicker015b 0.15s 1;
    }

    @keyframes flicker015b {
      0%, 33%, 66% { opacity: 1; }
      16%, 50%, 83% { opacity: 0; }
    }

    .flicker-015-c {
      animation: flicker015c 0.15s 1;
    }

    @keyframes flicker015c {
      0%, 40% { opacity: 1; }
      20%, 60%, 80% { opacity: 0; }
    }

    /* Flicker animations for 0.3s duration */
    .flicker-03-a {
      animation: flicker03a 0.3s 1;
    }

    @keyframes flicker03a {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0; }
    }

    .flicker-03-b {
      animation: flicker03b 0.3s 1;
    }

    @keyframes flicker03b {
      0%, 20%, 60% { opacity: 1; }
      10%, 40%, 80% { opacity: 0; }
    }

    .flicker-03-c {
      animation: flicker03c 0.3s 1;
    }

    @keyframes flicker03c {
      0%, 33%, 66% { opacity: 1; }
      16%, 50%, 83% { opacity: 0; }
    }

    .title-container {
      color: #efa2c4;
      text-shadow: #b5137f 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.1vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.7vh;
      font-style: italic;
      letter-spacing: -0.1vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }

    .date-container {
      color: #f307b0;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3.5vh;
      line-height: 4vh;
    }

    .dateleft,
    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }

    .dateleft { position: relative; left: 0; }
    .dateright { position: absolute; right: 0; }
  </style>
</head>
<body>
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../kal/" class="dates dateleft">07/04/25</a>
    <a href="../index.html" class="clockname">Vegas</a>
    <a href="../polaris/" class="dates dateright">07/06/25</a>
  </div>

  <iframe width="560" height="315" src="https://www.youtube.com/embed/jtvmwjzZY0c?si=TNdQG5g7_q2UBXa-&autoplay=1&mute=1" title="YouTube video player" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <div class="wrapper">
    <div class="clock-container" id="clock">
      <div class="digit-group">
        <div class="digit-box" id="hour1"></div>
        <div class="digit-box" id="hour2"></div>
      </div>
      <div class="digit-group">
        <div class="digit-box" id="minute1"></div>
        <div class="digit-box" id="minute2"></div>
      </div>
      <div class="digit-group">
        <div class="digit-box" id="second1"></div>
        <div class="digit-box" id="second2"></div>
      </div>
    </div>
  </div>

  <script>
    const flickerClasses = [
      'flicker-015-a', 'flicker-015-b', 'flicker-015-c',
      'flicker-03-a', 'flicker-03-b', 'flicker-03-c'
    ];

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function setFlicker() {
      const element = document.getElementById('minute2');
      
      // Remove any existing flicker
      flickerClasses.forEach(cls => element.classList.remove(cls));

      // Choose a random flicker animation
      const flickerClass = flickerClasses[Math.floor(Math.random() * flickerClasses.length)];
      
      // Apply flicker
      element.classList.add(flickerClass);

      // Remove flicker after animation duration
      const duration = flickerClass.includes('015') ? 150 : 300;
      setTimeout(() => {
        element.classList.remove(flickerClass);
      }, duration);

      // Schedule next flicker
      setTimeout(setFlicker, getRandomInt(1000, 3000));
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      // 12-hour conversion with leading zero:
      hours = hours % 12 || 12;
      const hourStr = String(hours).padStart(2, '0');

      document.getElementById('hour1').textContent = hourStr[0];
      document.getElementById('hour2').textContent = hourStr[1];
      document.getElementById('minute1').textContent = minutes[0];
      document.getElementById('minute2').textContent = minutes[1];
      document.getElementById('second1').textContent = seconds[0];
      document.getElementById('second2').textContent = seconds[1];
    }

    updateClock();
    setInterval(updateClock, 1000);
    setTimeout(setFlicker, 2000); // Start flickering after 2 seconds
  </script>
</body>
</html>
