<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
    rel="stylesheet"> 
  <title>Cinema Clock</title>
  <style>
      @font-face {
      font-family: 'mult';
      src: url('./mult.ttf') format('truetype');
    }
   
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock {
      position: absolute;
      top: 26%;
      font-family: 'mult', monospace;
      color: rgb(137, 3, 3);
      font-size: 1.5rem;
      letter-spacing: 0.5rem;
      text-transform: uppercase;
      z-index: 2;
    }
    .bgImage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: contrast(100%);
        z-index: 1;
        filter: alpha(opacity=50);
        pointer-events: none;
    }   

    .title-container {
      color: #190454;
      text-shadow: #e7e0e0 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }
    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
      text-decoration: none;
    }
    .date-container {
      color: #d6abab;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }
    .dateleft, .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }
    .dateleft { left: 0; position: relative; }
    .dateright { right: 0; position: absolute; }
    .divider {
      height: 1px;
      width: 30vw;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>
  <div class="date-container">
    <a href="../eggs2/" class="dates dateleft">06/30/25</a>
    <a href="../index.html" class="clockname">Cinema</a>
   <a href="../backwards/"  class="dates dateright">07/02/25</a>
  </div>
     <img src="./mu.jpg" class="bgImage">
  <div class="clock" id="clock"></div>

 <script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();

    hours = hours % 12;
    hours = hours ? hours : 12;

    const hourStr = hours; // Display hours without leading zero
    const minuteStr = minutes < 10 ? '0' + minutes : minutes;

    document.getElementById('clock').textContent = `${hourStr}${minuteStr}`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
