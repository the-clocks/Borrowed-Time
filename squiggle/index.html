<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <title>Squiggling Analog Clock</title>
  <style>
    @font-face {
      font-family: 'squ';
      src: url('./squ.ttf') format('truetype');
    }
    html, body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #486d48;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      max-width: 90vw;
      max-height: 90vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }

    .date-container {
      color: rgb(184, 244, 172);
      position: absolute;
      bottom: 1vh;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }

    .dateleft,
    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
    }

    .dateleft {
      position: relative;
      left: 0;
    }

    .dateright {
      position: absolute;
      right: 0;
    }

    .title-container {
      color: #b8cb9d;
      text-shadow: #201e1f 0.1vh 0;
      position: absolute;
      top: 0.5vh;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.1vh;
      position: absolute;
      top: 0.5vh;
      right: 1vh;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.7vh;
      font-style: italic;
      letter-spacing: -0.1vh;
    }
  </style>
</head>
<body>

  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../parallel/" class="dates dateleft">06/22/25</a>
    <a href="../index.html" class="clockname">Squiggle</a>
   <a href="../thoughtballoon/" class="dates dateright">06/24/25</a>
  </div>

  <canvas id="clockCanvas"></canvas>

  <script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const size = Math.min(window.innerWidth, window.innerHeight) * 0.8;
      canvas.width = size;
      canvas.height = size;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let distortionPhase = 0;
    const distortionSpeed = 0.03;

    function drawClock() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width * 0.46;
      const now = new Date();
      const hours = now.getHours() % 12 + now.getMinutes() / 60;
      const minutes = now.getMinutes() + now.getSeconds() / 60;
      const seconds = now.getSeconds() + now.getMilliseconds() / 1000;

      const offCanvas = document.createElement('canvas');
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.fillStyle = '#9D949DFF';
      offCtx.beginPath();
      offCtx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      offCtx.fill();

     // Numbers
offCtx.fillStyle = '#F5DA6DFF';
offCtx.font = `${canvas.width * 0.16}px squ`;
offCtx.textAlign = 'center';
offCtx.textBaseline = 'middle';

// Text shadow
offCtx.shadowColor = '#060301FC';
offCtx.shadowBlur = 0;
offCtx.shadowOffsetX = 2;
offCtx.shadowOffsetY = 2;

for (let i = 0; i < 12; i++) {
  const angle = (i * 30 - 90) * Math.PI / 180;
  const numberX = centerX + (radius - canvas.width * 0.08) * Math.cos(angle);
  const numberY = centerY + (radius - canvas.width * 0.08) * Math.sin(angle);
  offCtx.fillText(i === 0 ? 12 : i, numberX, numberY);
}


      // Hour hand
      offCtx.save();
      offCtx.translate(centerX, centerY);
      offCtx.fillStyle = '#AFF3ACFF';
      offCtx.rotate(hours * 30 * Math.PI / 180);
      offCtx.fillRect(-canvas.width * 0.01, -radius * 0.5, canvas.width * 0.02, radius * 0.7);
      offCtx.restore();

      // Minute hand
      offCtx.save();
      offCtx.translate(centerX, centerY);
      offCtx.fillStyle = '#BEB2EAFF';
      offCtx.rotate(minutes * 6 * Math.PI / 180);
      offCtx.fillRect(-canvas.width * 0.006, -radius * 0.7, canvas.width * 0.012, radius * 0.9);
      offCtx.restore();

      // Second hand
      offCtx.save();
      offCtx.translate(centerX, centerY);
      offCtx.fillStyle = '#EF1444FF';
      offCtx.rotate(seconds * 6 * Math.PI / 180);
      offCtx.fillRect(-canvas.width * 0.004, -radius * 0.9, canvas.width * 0.008, radius * 1.1);
      offCtx.restore();

      // Apply distortion
      const amplitude = 20;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const imageData = offCtx.getImageData(0, 0, canvas.width, canvas.height);
      const distortedData = ctx.createImageData(canvas.width, canvas.height);

      for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {
          const offset = Math.sin(y / 20 + distortionPhase) * amplitude;
          const srcX = Math.floor(x + offset);
          if (srcX >= 0 && srcX < canvas.width) {
            const srcIdx = (y * canvas.width + srcX) * 4;
            const dstIdx = (y * canvas.width + x) * 4;
            for (let i = 0; i < 4; i++) {
              distortedData.data[dstIdx + i] = imageData.data[srcIdx + i];
            }
          }
        }
      }

      ctx.putImageData(distortedData, 0, 0);
      distortionPhase += distortionSpeed;
    }

    function animate() {
      drawClock();
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
