<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ASCII Clock</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: 'ascii';
      src: url('ascii.ttf') format('truetype');
    } 
    body {
      background: rgb(32, 31, 31);
      color: rgb(224, 250, 224);
      white-space: pre;
      font-size: 1.0rem;
      padding: 0rem;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #clock {
      line-height: 0.9;
      letter-spacing: 0.3;
      font-family: 'ascii';
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .digit-group {
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .title-container {
      color: #a2a2a0;
      text-shadow: #100f0f 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }
    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
      text-decoration: none;
    }
    .date-container {
      color: #d6d5d4;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }
    .dateleft {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: relative;
      left: 0;
    }
    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: absolute;
      right: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .digit-train {
        transition: none;
      }
      .digit-train span.leaving {
        animation: none;
        opacity: 0;
      }
      .wrapper {
        animation: none;
        transform: translateX(25vw) rotate(26deg);
      }
    }
    .bgimage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh; 
      background-repeat: repeat;
      transform: scaleX(-1);
      filter: invert(0.9) brightness(0.5);
      z-index: -1;
    }
  </style>
</head>
<body>
  <img src="./ascii.jpg" class="bgimage" />
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>
  <div class="date-container">
    <a href="../cartoon/" class="dates dateleft">07/14/25</a>
    <a href="../index.html" class="clockname">ASCII</a>
    <a href="../mobius" class="dates dateright">07/16/25</a>
  </div>

  <div id="clock"></div>

  <script>
    const DIGITS = {
      '0': [" 00000 ","00   00","00   00","00   00","00   00","00   00"," 00000 ","       "],
      '1': ["   11  ","  111  "," 1 11  ","   11  ","   11  ","   11  "," 111111","       "],
      '2': [" 22222 ","22   22","    22 ","   22  ","  22   "," 22    ","2222227","       "],
      '3': [" 33333 ","33   33","     33","  3333 ","     33","33   33"," 33333 ","       "],
      '4': ["   44  ","  444  "," 4 44  ","4  44  ","4444444","   44  ","   44  ","       "],
      '5': ["5555555","55     ","55555  ","    55 ","     55","55   55"," 55555 ","       "],
      '6': [" 66666 ","66     ","66666  ","66  66 ","66  66 ","66  66 "," 66666 ","       "],
      '7': ["7777777","     77","    77 ","   77  ","  77   "," 77    ","77     ","       "],
      '8': [" 88888 ","88   88","88   88"," 88888 ","88   88","88   88"," 88888 ","       "],
      '9': [" 99999 ","99   99","99   99"," 999999","     99","    99 "," 9999  ","       "],
      'A': ["   AA  ","  A  A "," A    A"," AAAAAA"," A    A"," A    A","A      A","       "],
      'M': ["M     M","MM   MM","M M M M","M  M  M","M     M","M     M","M     M","       "],
      'P': ["PPPPP  ","P    P ","P    P ","PPPPP  ","P      ","P      ","P      ","       "]
    };

    function makeGroup(str) {
      const rows = Array(8).fill('');
      for (const char of str) {
        const glyph = DIGITS[char] || ['       ','       ','       ','       ','       ','       ','       ','       '];
        for (let i = 0; i < 8; i++) {
          rows[i] += glyph[i] + '';
        }
      }
      return rows.join('\n');
    }

    function drawClock() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const isPM = h >= 12;

      h = h % 12 || 12;
      const hStr = String(h);
      const ampm = isPM ? 'PM' : 'AM';

      const clock = document.getElementById('clock');
      clock.innerHTML = '';

      const group = (str) => {
        const div = document.createElement('div');
        div.className = 'digit-group';
        div.textContent = makeGroup(str);
        return div;
      };

      clock.appendChild(group(hStr));
      clock.appendChild(group(m));
      clock.appendChild(group(s));
      clock.appendChild(group(ampm));
    }

    setInterval(drawClock, 1000);
    drawClock();
  </script>
</body>
</html>
