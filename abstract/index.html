<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SVG Morphing Clock (12-Hour)</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ce54);
      background-size: 400%;
      animation: backgroundGradient 15s ease infinite;
    }

    @keyframes backgroundGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    svg {
      width: 90vw;
      max-width: 800px;
      height: auto;
    }

    path {
      transition: fill 0.3s;
    }
  </style>
</head>
<body>
  <svg id="clock" viewBox="0 0 800 200">
    <defs>
      <linearGradient id="digitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#ff9f43">
          <animate attributeName="stop-color" values="#ff9f43; #4834d4; #eb3b5a; #6ab04c; #ff9f43" dur="12s" repeatCount="indefinite"/>
        </stop>
        <stop offset="100%" style="stop-color:#4834d4">
          <animate attributeName="stop-color" values="#4834d4; #eb3b5a; #6ab04c; #ff9f43; #4834d4" dur="12s" repeatCount="indefinite"/>
        </stop>
      </linearGradient>
    </defs>
    <g id="digitGroup" transform="translate(100, 0)"></g>
  </svg>

  <script src="https://unpkg.com/flubber@0.4.2"></script>
  <script>
    const digitPaths = {
      "0": "M40,20 A20,20 0 1,1 40,180 A20,20 0 1,1 40,20 Z",
      "1": "M60,30 L60,170",
      "2": "M40,40 Q60,20 80,40 T60,80 Q40,100 80,160",
      "3": "M40,40 Q60,20 80,40 Q60,80 80,100 Q60,120 40,100",
      "4": "M80,100 L40,100 L60,40 L60,180",
      "5": "M80,40 H40 V90 Q60,70 80,90 Q60,120 40,100",
      "6": "M80,40 Q40,40 40,90 Q60,70 80,90 Q60,120 40,100 Q40,180 80,160",
      "7": "M40,40 H80 L60,180",
      "8": "M60,60 A20,20 0 1,1 60,100 A20,20 0 1,1 60,60 M60,100 A20,20 0 1,1 60,140 A20,20 0 1,1 60,100",
      "9": "M80,140 Q40,140 40,90 Q60,110 80,90 Q60,60 40,80 Q40,20 80,40",
      ":": "M60,70 A5,5 0 1,1 59,70 Z M60,130 A5,5 0 1,1 59,130 Z",
      "A": "M40,180 L60,40 L80,180 M50,120 H70",
      "M": "M40,180 L50,40 L60,180 M70,40 L80,180",
      "P": "M40,180 L40,40 H80 Q80,80 40,80"
    };

    const clockEl = document.getElementById('digitGroup');
    const digits = [];

    const MAX_DIGITS = 11; // Increased to handle "HH:MM:SS AM/PM"
    const DIGIT_SPACING = 91;

    // Create reusable digit paths
    for (let i = 0; i < MAX_DIGITS; i++) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", digitPaths["0"]);
      path.setAttribute("fill", "url(#digitGradient)");
      clockEl.appendChild(path);
      digits.push(path);
    }

    let prevChars = Array(MAX_DIGITS).fill("");

    function updateClock() {
      const now = new Date();
      let time = now.toLocaleTimeString('en-US', { hour12: true }); // Changed to 12-hour format
      time = time.replace(/^0/, ""); // Remove leading 0 for hours (e.g., "01:23:45 PM" -> "1:23:45 PM")
      const chars = time.split('');
      const len = chars.length;

      // Center digit group dynamically
      const totalWidth = (len - 1) * DIGIT_SPACING;
      clockEl.setAttribute("transform", `translate(${(800 - totalWidth) / 2}, 0)`);

      digits.forEach((digit, i) => {
        if (i < len) {
          const char = chars[i];
          if (digitPaths[char] && char !== prevChars[i]) {
            const from = digitPaths[prevChars[i]] || digitPaths["0"];
            const to = digitPaths[char];
            const interpolator = flubber.interpolate(from, to);
            let frame = 0;
            const total = 15;

            function animate() {
              if (frame <= total) {
                digit.setAttribute("d", interpolator(frame / total));
                frame++;
                requestAnimationFrame(animate);
              }
            }
            animate();
            prevChars[i] = char;
          }

          // Make sure digit is visible and positioned
          digit.setAttribute("transform", `translate(${i * DIGIT_SPACING}, 0)`);
          digit.style.display = "inline";
        } else {
          digit.style.display = "none"; // Hide unused digits
          prevChars[i] = "";
        }
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
