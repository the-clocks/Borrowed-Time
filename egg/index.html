<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Analog Clock with Image Numbers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet"> <style>
    body {
      margin: 0;
      background: #f0d135;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .clock {
      position: relative;
      width: 80vw;
      height: 80vw;
    }

    .number {
      position: absolute;
      width: rem;
      height: 4rem;
      transform: translate(-50%, -50%);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      background: white;
      border-radius: 0.3rem;
    }

    .hour {
      width: 0.6rem;
      height: 12vh;
      background: #fff;
    }

    .minute {
      width: 0.4rem;
      height: 18vh;
      background: #f5d33a;
    }

    .second {
      width: 0.1rem;
      height: 29vh;
      background: rgb(9, 9, 9);
    }

        .title-container {
            color: #d5d7d9;
            text-shadow: #878781 1px 0px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            /* justify-content: space-between; */
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.8vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.8vh;
            font-style: italic;
            z-index: 15;
            letter-spacing: -0.1vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
            text-decoration: none;
        }

        .date-container {
            color: #686a6b;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            /* justify-content: space-between; */
            z-index: 6;
        }

        .clockname {
            font-family: "Oxanium", serif;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Oxanium", serif;
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: relative;
            left: 0;
        }

        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: absolute;
            right: 0;
        }

        @keyframes slow-rotate {
            0% {
                transform: rotate(0deg) scale(1.5);
            }

            100% {
                transform: rotate(360deg) scale(1.5);
            }
        }

        .bgimage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* object-fit: cover; */
            filter: contrast(0.9);
            z-index: -1;
            animation: slow-rotate 60s linear infinite;
            transform-origin: center center;
        }
  </style>
</head>
<body>

    <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>
    <div class="date-container">
        <a href="../dashboard/" class="dates dateleft">06/28/25</a>
        <a href="../index.html" class="clockname">Eggs</a>
        <a href="../coffee/" class="dates dateright">07/01/25</a>
    </div>
    <img src="./eggg.gif" class="bgimage" />
  <div class="clock">
    <!-- Number images -->
    <img src="./12.gif" class="number" style="top: 10%; left: 50%;" />
    <img src="./1.gif" class="number" style="top: 18%; left: 75%;" />
    <img src="./2.png" class="number" style="top: 32%; left: 88%;" />
    <img src="./3.png" class="number" style="top: 50%; left: 95%;" />
    <img src="./4.gif" class="number" style="top: 68%; left: 88%;" />
    <img src="./5.gif" class="number" style="top: 82%; left: 75%;" />
    <img src="6.gif" class="number" style="top: 90%; left: 50%;" />
    <img src="7.png" class="number" style="top: 82%; left: 25%;" />
    <img src="./8.gif" class="number" style="top: 68%; left: 12%;" />
    <img src="./9.gif" class="number" style="top: 50%; left: 5%;" />
    <img src="./10.png" class="number" style="top: 32%; left: 12%;" />
    <img src="./11.gif" class="number" style="top: 18%; left: 25%;" />

    <!-- Hands -->
    <div class="hand hour" id="hour-hand"></div>
    <div class="hand minute" id="minute-hand"></div>
    <div class="hand second" id="second-hand"></div>
  </div>

  <script>
    const hourHand = document.getElementById("hour-hand");
    const minuteHand = document.getElementById("minute-hand");
    const secondHand = document.getElementById("second-hand");

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      const secDeg = seconds * 6;
      const minDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = hours * 30 + minutes * 0.5;

      secondHand.style.transform = `translate(-50%, 0) rotate(${secDeg}deg)`;
      minuteHand.style.transform = `translate(-50%, 0) rotate(${minDeg}deg)`;
      hourHand.style.transform = `translate(-50%, 0) rotate(${hourDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
