<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backslant Clock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: 'back';
      src: url('back.ttf') format('truetype');
    }
    html,
    body {
      margin: 0;
      padding: 0;
      background-image: linear-gradient(24deg, #211408 6.25%, #f3a64e 6.25%, #ea8007 25%, #fff 25%, #f9c2c2 31.25%, #e3630d 31.25%, #e3630d 50%, #211408 50%, #0b30ea 56.25%, #ed8917 56.25%, #ed8917 75%, #f60808 75%, #fff 81.25%, #e3630d 81.25%, #e3630d 100%);
      background-size: 19.67px 8.76px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .wrapper {
      transform: translateX(25vw);
      transform-origin: center center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      animation: rotateClock 10s ease-in-out infinite;
    }
  @keyframes rotateClock {
  0% {
    transform: translateX(25vw) rotate(0deg);
  }
   30% {
    transform: translateX(25vw) rotate(0deg);
  }
   50% {
    transform: translateX(25vw) rotate(26deg);
  }
   92% {
    transform: translateX(25vw) rotate(26deg);
  }

  
  100% {
    transform: translateX(25vw) rotate(360deg);
  }
}
    .clock {
      font-family: 'back', monospace;
      display: flex;
      flex-direction: column;
    }
    .clock-row {
      display: flex;
      align-items: center;
      height: 3rem;
      width: 100vw;
      padding: 0 1rem;
      box-sizing: border-box;
      position: relative;
    }
    .digit-train {
      display: flex;
      align-items: center;
      font-size: 3.5rem;
      color: rgb(4, 95, 151);
      text-shadow: #f24e07 2px 2px 0px;
      transition: transform 0.4s linear;
      white-space: nowrap;
    }
    .digit-train span {
      width: 1.7rem;
      text-align: center;
      flex-shrink: 0;
      position: relative;
      user-select: none;
    }
    .digit-train span.active {
      color: rgb(24, 11, 2);
      text-shadow: #f5ee67 -2px -1px 3px;
    }
    @keyframes rollLeftFadeOut {
      0% {
        opacity: 1;
        transform: translateX(0) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateX(-50px) rotate(-90deg);
      }
    }
    .digit-train span.leaving {
      animation: rollLeftFadeOut 0.4s forwards;
      z-index: 10;
    }
    .title-container {
      color: #838380;
      text-shadow: #de4007 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }
    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
      text-decoration: none;
    }
    .date-container {
      color: #4e3d0f;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }
    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }
    .dateleft {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: relative;
      left: 0;
    }
    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: absolute;
      right: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .digit-train {
        transition: none;
      }
      .digit-train span.leaving {
        animation: none;
        opacity: 0;
      }
      .wrapper {
        animation: none;
        transform: translateX(25vw) rotate(26deg);
      }
    }
  </style>
</head>
<body>
    <div class="title-container">
      <div class="chltitle">Cubist Heart Laboratories</div>
      <div class="bttitle">BorrowedTime</div>
    </div>
    <div class="date-container">
      <a href="../klaxon/" class="dates dateleft">06/17/25</a>
      <a href="../index.html" class="clockname">Backslant</a>
      <a href="../cistercian/" class="dates dateright">06/19/25</a>
    </div>
    <div class="wrapper">
      <div class="clock" role="timer" aria-label="Digital clock displaying current time">
        <div class="clock-row"><div class="digit-train" id="h0train"></div></div>
        <div class="clock-row"><div class="digit-train" id="h1train"></div></div>
        <div class="clock-row"><div class="digit-train" id="m0train"></div></div>
        <div class="clock-row"><div class="digit-train" id="m1train"></div></div>
        <div class="clock-row"><div class="digit-train" id="s0train"></div></div>
        <div class="clock-row"><div class="digit-train" id="s1train"></div></div>
      </div>
    </div>
  <script>
    const ids = ['h0', 'h1', 'm0', 'm1', 's0', 's1'];

    function createDigitLine() {
      const digits = document.createDocumentFragment();
      for (let i = 0; i < 50; i++) {
        const span = document.createElement('span');
        span.textContent = i % 10;
        digits.appendChild(span);
      }
      return digits;
    }

    const trains = {};
    const positions = {};
    const lastDigits = {};
    const targetOffsets = {};
    const currentOffsets = {};

    ids.forEach(id => {
      const trainEl = document.getElementById(id + 'train');
      trainEl.appendChild(createDigitLine());
      trains[id] = trainEl;
      positions[id] = 0;
      lastDigits[id] = null;
      targetOffsets[id] = 0;
      currentOffsets[id] = 0;
    });

    function lerp(start, end, factor) {
      return start + (end - start) * factor;
    }

    function updateClock() {
      const now = new Date();
      const timeDigits = [
        ...now.getHours().toString().padStart(2, '0'),
        ...now.getMinutes().toString().padStart(2, '0'),
        ...now.getSeconds().toString().padStart(2, '0'),
      ];

      timeDigits.forEach((digit, i) => {
        const id = ids[i];
        const train = trains[id];

        if (digit !== lastDigits[id]) {
          // Clear all active classes, except for leaving spans
          Array.from(train.children).forEach(span => {
            if (!span.classList.contains('leaving')) {
              span.classList.remove('active');
            }
          });

          // Apply leaving animation to the previously active digit
          const oldActiveSpan = train.querySelector('span.active');
          if (oldActiveSpan) {
            oldActiveSpan.classList.add('leaving');
            oldActiveSpan.addEventListener(
              'animationend',
              () => {
                oldActiveSpan.classList.remove('leaving', 'active');
              },
              { once: true }
            );
          }

          // Update position and target offset
          positions[id] = getNextPosition(id, digit);
          const spanWidth = train.children[0].offsetWidth || 0;
          targetOffsets[id] = positions[id] * spanWidth;
          lastDigits[id] = digit;

          // Set new active digit
          const activeIndex = positions[id];
          if (train.children[activeIndex]) {
            train.children[activeIndex].classList.add('active');
          }
        }
      });

      // Smoothly interpolate offsets
      ids.forEach(id => {
        const train = trains[id];
        currentOffsets[id] = lerp(currentOffsets[id], targetOffsets[id], 0.1);
        train.style.transform = `translateX(-${currentOffsets[id]}px)`;
      });

      requestAnimationFrame(updateClock);
    }

    function getNextPosition(id, digit) {
      const train = trains[id];
      const currentPos = positions[id];
      const children = Array.from(train.children);

      for (let i = currentPos + 1; i < children.length; i++) {
        if (children[i].textContent === digit) {
          return i;
        }
      }
      for (let i = 0; i <= currentPos; i++) {
        if (children[i].textContent === digit) {
          return i;
        }
      }
      return currentPos;
    }

    function updateDates() {
      const now = new Date();
      const prevDay = new Date(now);
      prevDay.setDate(now.getDate() - 1);
      const nextDay = new Date(now);
      nextDay.setDate(now.getDate() + 1);

      const formatDate = (date) =>
        `${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}/${String(date.getFullYear()).slice(-2)}`;

      document.querySelector('.dateleft').textContent = formatDate(prevDay);
      document.querySelector('.dateright').textContent = formatDate(nextDay);
    }

    window.onload = () => {
      updateDates();
      updateClock();
    };
  </script>
</body>
</html>
