<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Clock</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(0deg, purple 50%, orange 50%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .clock {
      position: relative;
      width: 300px;
      height: 300px;
      /* border: 10px solid #fff; */
      border-radius: 50%;
      /* background: #222; */
    }

    .hand {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: left;
      transform: translateY(-50%) rotate(0deg);
    }

    .hour {
      width: 200vw;
      height: 1px;
      background: rgb(255, 254, 254);
    }

    .minute {
      width: 200vw;
      height: 9px;
      background: rgb(252, 253, 252);
    }

    .second {
      width: 200vw;
      height: 1px;
      background: rgb(6, 6, 6);
      transform-origin: center;
      transform: translate(-50%, -50%) rotate(0deg);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="clock">
    <div class="hand hour" id="hour-hand"></div>
    <div class="hand minute" id="minute-hand"></div>
    <div class="hand second" id="second-hand"></div>
    <div class="center"></div>
  </div>

  <script>
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const secondHand = document.getElementById('second-hand');
    const body = document.body;

    let startTime = Date.now();

    function updateClock() {
      const now = new Date();
      const elapsed = (Date.now() - startTime) / 1000; // Time in seconds

      // Calculate angles
      const seconds = elapsed % 60; // Continuous seconds
      const minutes = now.getMinutes() + seconds / 60;
      const hours = now.getHours() + minutes / 60;

      const secondDeg = seconds * 6; // 360 / 60 = 6 degrees per second
      const minuteDeg = minutes * 6; // 360 / 60 = 6 degrees per minute
      const hourDeg = ((hours % 12) / 12) * 360; // 360 / 12 = 30 degrees per hour

      // Apply transformations
      secondHand.style.transform = `translate(-50%, -50%) rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `translateY(-50%) rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `translateY(-50%) rotate(${hourDeg}deg)`;

      // Update body background gradient to match second hand
      body.style.background = `linear-gradient(${secondDeg}deg, blue 50%, yellow 50%)`;

      requestAnimationFrame(updateClock);
    }

    updateClock(); // Start the animation
  </script>
</body>
</html>
