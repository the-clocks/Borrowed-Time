<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SUV Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&family=Rock+3D&display=swap"
    rel="stylesheet">
  <style>
    @font-face {
      font-family: 'suv';
      src: url('./suv.ttf') format('truetype');
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      background: #378a69;
      font-family: 'suv', sans-serif;
      font-size: 10vw;
      padding: 0vw;
      box-sizing: border-box;
    }

  #clock {
  position: fixed; /* or 'absolute' depending on your layout */
  right: 150px;
  top: 51%;
  transform: translateY(-50%); /* vertically center it */
  color: rgb(226, 224, 234);
  text-shadow: #090802 1px 1px, #f3f3ee -1px 0px;
  display: flex;
  font-size: 0.8rem;
  text-align: left;
  z-index: 2;
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum';
  line-height: 1;
  opacity: 0.8;
  gap: 0;
}


    #clock span {
      display: block;
      text-align: left;
    }

    #ampm {
      margin-left: 0.0vw;
      font-size: 0.8em;
      align-self: flex-end;
    }

    .bgimage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-position: left;
      background-repeat: no-repeat;
      filter: brightness(160%) saturate(90%) hue-rotate(30deg);
      z-index: 2;
      pointer-events: none;
      transform: scaleX(-1);
    }

    .bgimage2 {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(300%) saturate(30%) hue-rotate(30deg);
      z-index: 1;
      pointer-events: none;
      transform: scaleX(-1);
    }

    .date-container {
      color: #056c03;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      font-family: "Oxanium", serif;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vh;
      line-height: 4vh;
    }

    .dateleft {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: relative;
      left: 0;
    }

    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: absolute;
      right: 0;
    }

    .title-container {
      color: #bebcbc;
      text-shadow: #141314 1px 0px;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      z-index: 15;
      letter-spacing: -0.1vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../polaris/" class="dates dateleft">07/06/25</a>
    <a href="../index.html" class="clockname">SUV</a>
    <a href="../index.html" class="dates dateright">07/08/25</a>
  </div>

  <img src="./suvx.jpg" class="bgimage2">
  <img src="suv.gif" class="bgimage">

  <div id="clock">
    <span id="h">00</span><span id="m">00</span><span id="ampm">AM</span>
  </div>

  <script>
    function pad(num) {
      return num.toString().padStart(2, '0');
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;

      document.getElementById('h').textContent = pad(hours);
      document.getElementById('m').textContent = pad(minutes);
      document.getElementById('ampm').textContent = ampm;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
