<!doctype html>
<html lang="en">

<head>
    <title>Primary Color Clock</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(234, 119, 10);
        }

   

        .center-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            
          
        }

        .clock {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }

        .hand {
            width: 50%;
            right: 50%;
            position: absolute;
            top: 50%;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition-timing-function: cubic-bezier(0.1, 2.7, 0.58, 1);
        }

        .hand.min-hand {
            height: 9vh;
            width: 100%;
            background: #f76f07;
            z-index: 11;
        }

        .hand.hour-hand {
            height: 11vh;
            width: 72%;
            background: #09dd09;
            z-index: 18;
        }

        .hand.second-hand {
            height: 4vh;
            width: 400%;
            background: #b503fb;
            z-index: 19;
        }

      
      .bgimage {
    position: fixed; /* Makes it stay while scrolling */
    top: 0;
    left: 0;
    width: 200vw;
    height: 200vh;
    background-image: url('./images/tumblr_53c27c64cc9f17a0880aff18b8f6d934_d138a0cd_500.gif');
    background-repeat: repeat;
    background-size: 159vh 12vw; /* Control how tightly it tiles */
    background-attachment: fixed; /* Key for parallax */
    z-index: -1; /* Move it behind content */
    pointer-events: none;
    opacity: 0.5;
    filter: hue-rotate(-320deg);
    transform: rotate(178deg);
}
  .bgimage2 {
    position: fixed; /* Makes it stay while scrolling */
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('./images/tumblr_53c27c64cc9f17a0880aff18b8f6d934_d138a0cd_500.gif');
    background-repeat: repeat;
    background-size: 159vh 12vw; /* Control how tightly it tiles */
    background-attachment: fixed; /* Key for parallax */
    z-index: -1; /* Move it behind content */
    pointer-events: none;
    opacity: 0.5;
    filter: hue-rotate(-320deg);
    transform: rotate(182deg);
}


    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const secondHand = document.querySelector('.second-hand');
            const minsHand = document.querySelector('.min-hand');
            const hourHand = document.querySelector('.hour-hand');

            function setDate() {
                const now = new Date();

                const seconds = now.getSeconds();
                const secondsDegrees = ((seconds / 60) * 360) + 90;
                secondHand.style.transform = `rotate(${secondsDegrees}deg)`;

                const mins = now.getMinutes();
                const minsDegrees = ((mins / 60) * 360) + ((seconds / 60) * 6) + 90;
                minsHand.style.transform = `rotate(${minsDegrees}deg)`;

                const hour = now.getHours();
                const hourDegrees = ((hour / 12) * 360) + ((mins / 60) * 30) + 90;
                hourHand.style.transform = `rotate(${hourDegrees}deg)`;
            }

            setInterval(setDate, 1000);
            setDate();
        });
    </script>

</head>

<body>
    

    <div class="bgimage"></div>
        <div class="bgimage2"></div>
<!-- 
    <div class="layer3"></div> -->
    <div class="center-container">
        <div class="clock">
            <div class="hand min-hand"></div>
            <div class="hand hour-hand"></div>
            <div class="hand second-hand"></div>
        </div>
    </div>

    </script>
</body>

</html>
