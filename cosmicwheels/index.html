<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
   <title>Cosmic Wheel Clock</title>
    <style>
          @font-face {
            font-family: 'whe';
            src: url('./whe.ttf') format('truetype');
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #dbd7ca;
            font-family: monospace;
            overflow: hidden;
        }
        .clock-container {
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-section {
            display: flex;
        }
        .digit-box {
            font-family: 'whe';
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1;
            font-size: 10rem;
            width: 8rem;
            height: 8rem;
            background: transparent;
            -webkit-text-fill-color: transparent;
            background-image: url('./cosm.webp');
            background-size: cover;
            background-position: center;
            -webkit-background-clip: text;
            background-clip: text;
            /* text-shadow: 0.11px 1px 0px rgb(241, 232, 209); */
        }
        .digit-box:nth-child(odd) {
            animation: spin-counterclockwise 30s linear infinite;
        }
        .digit-box:nth-child(even) {
            animation: spin-clockwise 30s linear infinite;
        }
        @keyframes spin-counterclockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
        @keyframes spin-clockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
      
        @media (min-width: 768px) {
            .clock-container {
                flex-direction: row;
            }
        }

        @keyframes slow-rotate {
            0% {
                transform: rotate(0deg) scale(1.5);
            }

            100% {
                transform: rotate(-360deg) scale(1.5);
            }
        }

        @keyframes slowrotate {
            0% {
                transform: rotate(0deg) scale(1.5);
            }

            100% {
                transform: rotate(360deg) scale(1.5);
            }
        }

        .bgimage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(0.9) invert();
            z-index: 1;
            opacity: 0.9;
            animation: slow-rotate 120s linear infinite;
            transform-origin: center center;
        }

        .bgimage2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(0.9) invert();
            z-index: 2;
            opacity: 0.5;
            animation: slowrotate 120s linear infinite;
            transform-origin: center center;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
            text-decoration: none;
        }

        .date-container {
            color: #3e3e40;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .clockname {
            font-family: "Oxanium", serif;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: relative;
            left: 0;
        }

        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: absolute;
            right: 0;
        }

        .title-container {
            color: #d6d7c3;
            text-shadow: #9b9d9c 1px 0px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.8vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.8vh;
            font-style: italic;
            z-index: 15;
            letter-spacing: -0.1vh;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>

    <div class="date-container">
        <a href="../bone/" class="dates dateleft">06/25/25</a>
        <a href="../index.html" class="clockname">Cosmic Wheels</a>
        <a href="../morse/" class="dates dateright">06/27/25</a>
    </div>
    <img src="./co.png" alt="Background Image" class="bgimage">
    <img src="./cos.png" alt="Background Image" class="bgimage2">
    <div class="clock-container">
        <div class="time-section" id="hours">
            <div class="digit-box"></div>
            <div class="digit-box"></div>
        </div>

        <div class="time-section" id="minutes">
            <div class="digit-box"></div>
            <div class="digit-box"></div>
        </div>

        <div class="time-section" id="seconds">
            <div class="digit-box"></div>
            <div class="digit-box"></div>
        </div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            hours = hours % 12 || 12;

            const pad = (num, digits) => String(num).padStart(digits, '0');
            const hoursStr = pad(hours, 2);
            const minutesStr = pad(minutes, 2);
            const secondsStr = pad(seconds, 2);

            updateTimeSection('hours', hoursStr);
            updateTimeSection('minutes', minutesStr);
            updateTimeSection('seconds', secondsStr);
        }

        function updateTimeSection(id, value) {
            const section = document.getElementById(id);
            const boxes = section.getElementsByClassName('digit-box');
            for (let i = 0; i < value.length; i++) {
                boxes[i].textContent = value[i];
            }
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
