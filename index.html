<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>BorrowedTime - Cubist Heart Laboratories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: "Noto Sans", sans-serif;
            animation: colorFade 90s infinite;
            transition: background-color 5s ease;
        }

        @keyframes colorFade {
            0% { background-color: rgb(255, 255, 255); }
            14% { background-color: rgb(242, 232, 213); }
            28% { background-color: rgb(242, 242, 221); }
            42% { background-color: rgb(213, 235, 213); }
            57% { background-color: rgb(229, 229, 249); }
            71% { background-color: rgb(230, 221, 236); }
            85% { background-color: rgb(239, 215, 239); }
            100% { background-color: rgb(255, 255, 255); }
        }

        .full-page-image,
        .full-page-image2,
        .full-page-image3 {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image: url("images/gears-13950_128.gif");
            background-repeat: repeat;
            background-position: center;
            pointer-events: none;
        }

        .full-page-image {
            background-size: 22vw 18vw;
            opacity: 0.15;
            z-index: 5;
            transform-origin: center center;
            transition: transform 0.1s ease-in-out;
        }

        .full-page-image2 {
            background-size: 21vw 17vw;
            opacity: 0.1;
            z-index: 4;
        }

        .full-page-image3 {
            background-size: 20vw 16vw;
            opacity: 0.1;
            z-index: 3;
        }

        .motto {
            font-family: "Cinzel", serif;
            color: rgba(150, 118, 29, 0.877);
            font-size: 1.3vh;
            letter-spacing: 0.5vh;
            text-align: center;
            background-color: #eadfc2;
        }

        .chltitle {
            font-family: "Noto Sans", sans-serif;
            color: rgb(125, 157, 131);
            font-size: 2.8vh;
            line-height: 3.5vh;
            background-color: #d9dad9;
            letter-spacing: 0.1vh;
            text-align: left;
        }

        .bttitle {
            font-family: "Oxanium", sans-serif;
            color: #140431;
            text-shadow: #bb1a1a 0.2vh 0vh 0px, #b6e548 -0.25vh -0.0vh 0px;
            font-size: 9vh;
            line-height: 8vh;
            text-align: center;
            font-style: italic;
            letter-spacing: -0.6vh;
        }

        .bt_newclockeveryday {
            font-size: 2vh;
            line-height: 2.7vh;
            font-weight: lighter;
            color: #802d3b;
            letter-spacing: 0.2vh;
            text-align: center;
            font-style: italic;
        }

        .todaysclockis {
            color: rgb(73, 86, 52);
            font-size: 2.5vh;
            line-height: 2.7vh;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #3c09bc;
        }

        a:hover {
            background-color: rgb(56, 1, 74);
            color: #edf4bf;
            text-decoration: underline;
        }

        .clocklist {
            font-size: 3vh;
            margin-top: 2vh;
        }

        .aboutthis {
            margin: 1vh;
            font-size: 2vh;
            line-height: 2vh;
        }

        .clocklistdate {
            letter-spacing: 0.2vh;
        }

        .copyright {
            font-size: 1.5vh;
            color: rgb(173, 169, 169);
            text-align: right;
            margin-top: 4vh;
        }
    </style>
</head>

<body>
    <div class="full-page-image"></div>
    <div class="full-page-image2"></div>
    <div class="full-page-image3"></div>

    <div class="motto">
        PLUS⬩ARS⬩CITIUS⬩OMNI⬩TEMPORE⬩NAM⬩QUISQUE*
    </div>

    <div class="chltitle">
        &nbsp;Cubist Heart Laboratories
    </div>

    <div class="bttitle">
        BorrowedTime
    </div>

    <div class="bt_newclockeveryday">
        a computationally intensive new clock, each day
    </div>

    <div class="clocklist">
        <div class="todaysclockis">
            Today is <span id="current-date"></span>.
        </div>
        <!-- YOUR CLOCK TABLE GOES HERE -->
    </div>

    <div class="copyright">
        *More Art Faster All The Time For Everyone<br>
        ©2025 Cubist Heart Laboratories. All rights reserved.
    </div>

    <script>
        // Update today's date
        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString('en-US', options);
            document.getElementById("current-date").textContent = today;
        }

        // Rotate the image every real second
        let rotation = 0;

        function tickRotateSync() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const delay = 1000 - ms;

            rotation += 6;
            document.querySelector(".full-page-image").style.transform = `rotate(${rotation}deg)`;

            setTimeout(tickRotateSync, delay);
        }

        // Start everything
        window.onload = function () {
            updateDate();
            setTimeout(tickRotateSync, 1000 - new Date().getMilliseconds());
        };
    </script>
    <script>
    // Set up rotation amount
    let rotation = 0;

    function rotateTick() {
        // Rotate 6° per second tick
        rotation += 6;
        document.querySelector(".full-page-image").style.transform = `rotate(${rotation}deg)`;

        // Align next call to the next full second
        const now = new Date();
        const delay = 1000 - now.getMilliseconds();
        setTimeout(rotateTick, delay);
    }

    // Start ticking after aligning to the next full second
    window.onload = () => {
        document.getElementById("current-date").textContent =
            new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

        // Sync with the start of the next second
        setTimeout(rotateTick, 1000 - new Date().getMilliseconds());
    };
</script>

</body>
</html>
