<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #1304bc;
            font-family: 'Arial', sans-serif;
        }
        #clock {
            position: relative;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .time-unit {
            position: absolute;
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            font-weight: bold;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: #dab7fc;
            text-align: center;
            line-height: 1;
        }
        #hours {
            width: 100%;
            height: 100%;
            font-size: calc(120vh / 2); /* Large font for background */
            background: #9f0426; /* Matches body background */
            z-index: 1;
        }
        #minutes {
            width: 80%;
            height: 60%; /* Takes up 60% of viewport height */
            font-size: calc(120vh / 4); /* Adjusted for 60% height */
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent for floating effect */
            /* border: 2px solid #dab7fc; */
            z-index: 2;
        }
        #seconds {
            width: 50%;
            height: 30%; /* Takes up 30% of viewport height */
            font-size: calc(120vh / 6); /* Adjusted for 30% height */
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent for floating effect */
            /* border: 2px solid #dab7fc; */
            z-index: 3;
        }
        #milliseconds {
            width: 20%;
            height: 5%; /* Takes up 5% of viewport height */
            font-size: calc(120vh / 12); /* Smaller font for milliseconds */
            background: rgba(0, 0, 0, 0.5); /* Semi-transparent for floating effect */
            /* border: 2px solid #dab7fc; */
            z-index: 4;
        }
        .time-unit span {
            display: block;
            width: 100%;
            height: 100%;
            transform: scale(3.5, 2) skew(40deg); /* Base distortion */
            display: flex;
            justify-content: center; /* Center text horizontally */
            align-items: center; /* Center text vertically */
            line-height: 1;
        }
        .morph {
            animation: morph 0.5s ease-in-out;
        }
        @keyframes morph {
            0% {
                transform: scale(3.5, 2) skew(40deg) rotateX(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(3.0, 1.5) skew(20deg) rotateX(45deg);
                opacity: 0.5;
            }
            100% {
                transform: scale(3.5, 2) skew(40deg) rotateX(0deg);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="clock">
        <div id="hours" class="time-unit"><span>00</span></div>
        <div id="minutes" class="time-unit"><span>00</span></div>
        <div id="seconds" class="time-unit"><span>00</span></div>
        <div id="milliseconds" class="time-unit"><span>000</span></div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
            
            const hoursSpan = document.getElementById('hours').querySelector('span');
            const minutesSpan = document.getElementById('minutes').querySelector('span');
            const secondsSpan = document.getElementById('seconds').querySelector('span');
            const millisecondsSpan = document.getElementById('milliseconds').querySelector('span');
            
            // Trigger morph animation only if the value changes
            if (hoursSpan.textContent !== hours) {
                hoursSpan.classList.add('morph');
                hoursSpan.textContent = hours;
            }
            if (minutesSpan.textContent !== minutes) {
                minutesSpan.classList.add('morph');
                minutesSpan.textContent = minutes;
            }
            if (secondsSpan.textContent !== seconds) {
                secondsSpan.classList.add('morph');
                secondsSpan.textContent = seconds;
            }
            if (millisecondsSpan.textContent !== milliseconds) {
                millisecondsSpan.classList.add('morph');
                millisecondsSpan.textContent = milliseconds;
            }
            
            // Remove the morph class after animation completes to allow re-triggering
            setTimeout(() => {
                hoursSpan.classList.remove('morph');
                minutesSpan.classList.remove('morph');
                secondsSpan.classList.remove('morph');
                millisecondsSpan.classList.remove('morph');
            }, 500); // Matches animation duration
        }
        updateClock();
        setInterval(updateClock, 10); // Update every 10ms for smoother millisecond updates
    </script>
</body>
</html>
