<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #1304bc;
            font-family: 'Arial', sans-serif;
        }
        #clock {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            color: #dab7fc;
            text-align: center;
            line-height: 1;
        }
        .time-unit {
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            font-weight: bold;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #hours, #minutes {
            flex: 1; /* Each takes up one third of the height */
            font-size: calc(120vh / 4.5); /* Adjusted for larger display in one third */
        }
        #bottom-third {
            flex: 1; /* Takes up bottom third */
            display: flex;
            flex-direction: row;
            justify-content: center; /* Center children horizontally */
            align-items: center; /* Center children vertically */
        }
        #seconds {
            flex: 2; /* Takes up 2/3 of bottom third */
            font-size: calc(120vh / 6.5); /* Adjusted for larger display */
        }
        #milliseconds {
            flex: 1; /* Takes up 1/3 of bottom third */
            font-size: calc(120vh / 8); /* Smaller font for milliseconds */
        }
        .time-unit span {
            display: block;
            width: 100%;
            height: 100%;
            transform: scale(3.5, 2) skew(40deg); /* Base distortion */
            display: flex;
            justify-content: center; /* Center text horizontally */
            align-items: center; /* Center text vertically */
            line-height: 1;
        }
        .morph {
            animation: morph 0.5s ease-in-out;
        }
        @keyframes morph {
            0% {
                transform: scale(3.5, 2) skew(40deg) rotateX(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(3.0, 1.5) skew(20deg) rotateX(45deg);
                opacity: 0.5;
            }
            100% {
                transform: scale(3.5, 2) skew(40deg) rotateX(0deg);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="clock">
        <div id="hours" class="time-unit"><span>00</span></div>
        <div id="minutes" class="time-unit"><span>00</span></div>
        <div id="bottom-third" class="time-unit">
            <div id="seconds" class="time-unit"><span>00</span></div>
            <div id="milliseconds" class="time-unit"><span>000</span></div>
        </div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
            
            const hoursSpan = document.getElementById('hours').querySelector('span');
            const minutesSpan = document.getElementById('minutes').querySelector('span');
            const secondsSpan = document.getElementById('seconds').querySelector('span');
            const millisecondsSpan = document.getElementById('milliseconds').querySelector('span');
            
            // Trigger morph animation only if the value changes
            if (hoursSpan.textContent !== hours) {
                hoursSpan.classList.add('morph');
                hoursSpan.textContent = hours;
            }
            if (minutesSpan.textContent !== minutes) {
                minutesSpan.classList.add('morph');
                minutesSpan.textContent = minutes;
            }
            if (secondsSpan.textContent !== seconds) {
                secondsSpan.classList.add('morph');
                secondsSpan.textContent = seconds;
            }
            if (millisecondsSpan.textContent !== milliseconds) {
                millisecondsSpan.classList.add('morph');
                millisecondsSpan.textContent = milliseconds;
            }
            
            // Remove the morph class after animation completes to allow re-triggering
            setTimeout(() => {
                hoursSpan.classList.remove('morph');
                minutesSpan.classList.remove('morph');
                secondsSpan.classList.remove('morph');
                millisecondsSpan.classList.remove('morph');
            }, 500); // Matches animation duration
        }
        updateClock();
        setInterval(updateClock, 10); // Update every 10ms for smoother millisecond updates
    </script>
</body>
</html>
