<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Clock</title>
  <style>
      @font-face {
      font-family: 'mult';
      src: url('./mult.ttf') format('truetype');
    }
   
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #0f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock {
        font-family: 'mult', monospace;
      font-size: 12vw;
      letter-spacing: 1vw;
      text-transform: uppercase;
    }
    .bgImage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: contrast(100%);
        z-index: 6;
        opacity: 0.5;
        filter: alpha(opacity=50);
        pointer-events: none;
   
    }   
  </style>
</head>
<body>
     <img src="./mu.jpg" class="bgImage">
  <div class="clock" id="clock"></div>

  <script>
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;

      const hourStr = hours < 10 ? '0' + hours : hours;
      const minuteStr = minutes < 10 ? '0' + minutes : minutes;

      document.getElementById('clock').textContent = `${hourStr}${minuteStr}${ampm}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
