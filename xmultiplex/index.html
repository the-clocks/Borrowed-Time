<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cinema Clock</title>
  <style>
      @font-face {
      font-family: 'mult';
      src: url('./mult.ttf') format('truetype');
    }
   
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clock {
      position: absolute;
      top: 26%;
      font-family: 'mult', monospace;
      color: rgb(129, 2, 2);
      font-size: 1.5rem;
      letter-spacing: 0.5rem;
      text-transform: uppercase;
      z-index: 2;
    }
    .bgImage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: contrast(100%);
        z-index: 1;
        /* opacity: 0.5; */
        filter: alpha(opacity=50);
        pointer-events: none;
   
    }   
  </style>
</head>
<body>
     <img src="./mu.jpg" class="bgImage">
  <div class="clock" id="clock"></div>

 <script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();

    hours = hours % 12;
    hours = hours ? hours : 12;

    const hourStr = hours < 10 ? '0' + hours : hours;
    const minuteStr = minutes < 10 ? '0' + minutes : minutes;

    document.getElementById('clock').textContent = `${hourStr}${minuteStr}`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
