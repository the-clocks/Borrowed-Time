<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morse Code Clock</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
  <style>
    @font-face {
      font-family: 'morse';
      src: url('morse.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .background-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 4;
    }

    .digit-box {
      width: 110vw;
      height: 1.2rem;
      margin: 0.9rem 0;
      background-color: #b87333;
      color: #b90404;
      text-shadow: 
        0px -2px 0px rgb(250, 247, 247), 
        -2px 0px 0px rgb(247, 242, 242), 
        2px 0px 0px rgba(0, 0, 0), 
        0px 2px 0px rgba(0, 0, 0),
        0px -1px 0px rgb(248, 241, 241), 
        -1px 0px 0px rgba(0, 0, 0), 
        1px 0px 0px rgba(0, 0, 0), 
        0px 1px 0px rgba(0, 0, 0);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      border-radius: 75px;
      z-index: 4;
      font-family: 'morse', Arial, sans-serif;
      box-shadow: 
        0px -8px 0px #9db4a0,
        -0px 8px 0px #9db4a0;
    }

        .title-container {
            color: #ebf0ea;
            text-shadow: #686666 1px 0;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.1vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.7vh;
            font-style: italic;
            letter-spacing: -0.1vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
        }

        /* Date container styles */
        .date-container {
            color: #3a3838;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .clockname {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-family: "Oxanium", serif;
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: relative;
            left: 0;
        }

        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: absolute;
            right: 0;
        }
  </style>
</head>
<body>

  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../cosmicwheels/" class="dates dateleft">06/26/25</a>
    <a href="../index.html" class="clockname">Morse Code</a>
    <a href="../twentyfour/" class="dates dateright">06/28/25</a>
  </div>
  <svg class="background-svg" viewBox="0 0 1000 500" preserveAspectRatio="none" id="wires-svg">
    <!-- Lines generated by JS -->
  </svg>

  <div class="clock">
    <div class="digit-box" id="hour1">0</div>
    <div class="digit-box" id="hour2">0</div>
    <div class="digit-box" id="minute1">0</div>
    <div class="digit-box" id="minute2">0</div>
    <div class="digit-box" id="second1">0</div>
    <div class="digit-box" id="second2">0</div>
  </div>

  <script>
    const svg = document.getElementById('wires-svg');
    const colors = [
      "#c0c6c7", "#99a3a3", "#B7410E", "#666666", "#333333", "#777777",
      "#444444", "#999999", "#888888", "#aaaaaa", "#bbbbbb", "#66615C",
      "#c0c6c7", "#99a3a3", "#B7410E", "#a0522d"
    ];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
function drawLines() {
  // Clear previous lines
  svg.innerHTML = '';

  const totalLines = 150; // Increased to accommodate new lines
  const width = 1000;
  const height = 500;

  // Distribute lines: 33% at top (0-20%), 33% in middle (40-60%), 33% at 3/4 (70-80%)
  for (let i = 0; i < totalLines; i++) {
    let startY, endY, controlY;
    if (i < totalLines / 3) {
      // Top lines (0-20% of height)
      startY = randomInt(0, height * 0.2);
      endY = startY + randomInt(-12, 12);
      controlY = startY + randomInt(20, 80);
    } else if (i < (2 * totalLines) / 3) {
      // Middle lines (40-60% of height)
      startY = randomInt(height * 0.2, height * 0.6);
      endY = startY + randomInt(-12, 12);
      controlY = startY + randomInt(20, 80);
    } else {
      // 3/4 lines (70-80% of height)
      startY = randomInt(height * 0.5, height * 0.4);
      endY = startY + randomInt(-12, 12);
      controlY = startY + randomInt(20, 80);
    }

    const controlX = randomInt(width * 0.4, width * 0.6);
    const d = `M0 ${startY} Q${controlX} ${controlY} ${width} ${endY}`;

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", colors[i % colors.length]);
    path.setAttribute("stroke-width", 1 + (i % 3) * 0.5);
    path.setAttribute("fill", "none");

    svg.appendChild(path);
  }
}

    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');

      document.getElementById('hour1').textContent = hours[0];
      document.getElementById('hour2').textContent = hours[1];
      document.getElementById('minute1').textContent = minutes[0];
      document.getElementById('minute2').textContent = minutes[1];
      document.getElementById('second1').textContent = seconds[0];
      document.getElementById('second2').textContent = seconds[1];

      drawLines(); // Redraw lines every second
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
