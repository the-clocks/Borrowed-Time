<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morse Code Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
      rel="stylesheet">
  <style>
    @font-face {
      font-family: 'morse';
      src: url('morse.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .background-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 4;
    }

    .digit-box {
      width: 110vw;
      height: 1.2rem;
      margin: 0.9rem 0;
      background-color: #b87333;
      color: #b90404;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      border-radius: 75px;
      z-index: 4;
      font-family: 'morse', Arial, sans-serif;
      box-shadow: 
        0px -8px 0px #9db4a0,
        0px 8px 0px #9db4a0,
        0px -10px 5px #ecf1c6,
        0px 9px 2px #1a1b1a;
    }

    .digit-text {
      text-shadow: 
        0px -2px 0px rgb(250, 247, 247), 
        -2px 0px 0px rgb(247, 242, 242), 
        2px 0px 0px rgba(0, 0, 0), 
        0px 2px 0px rgba(0, 0, 0),
        0px -1px 0px rgb(248, 241, 241), 
        -1px 0px 0px rgba(0, 0, 0), 
        1px 0px 0px rgba(0, 0, 0), 
        0px 1px 0px rgba(0, 0, 0);
      transition: opacity 0.3s ease-in-out;
      opacity: 1;
    }

    .digit-text.changing {
      opacity: 0.3;
    }

    .title-container {
      color: #ebf0ea;
      text-shadow: #686666 1px 0;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.1vh;
      position: absolute;
      top: 1px;
      right: 1px;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      position: relative;
      left: 0;
      font-family: "Oxanium", serif;
      font-size: 2.7vh;
      font-style: italic;
      letter-spacing: -0.1vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }

    .date-container {
      color: #3a3838;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 98%;
      display: flex;
      z-index: 6;
    }

    .clockname {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Oxanium", serif;
 действие: translateX(-50%);
      font-family: "Oxanium", serif;
      font-size: 4vh;
      line-height: 4vh;
    }

    .dateleft {
      font-size: 3vh; /* Corrected from 36vh */
      font-family: "Nanum Gothic Coding", monospace;
      position: relative;
      left: 0;
    }

    .dateright {
      font-size: 3vh;
      font-family: "Nanum Gothic Coding", monospace;
      position: absolute;
      right: 0;
    }

    .bgimage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.5;
    }

    .wire {
      transition: d 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <img src="./birds.gif" class="bgimage">
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../cosmicwheels/" class="dates dateleft">06/26/25</a>
    <a href="../index.html" class="clockname">Morse Code</a>
    <a href="../twentyfour/" class="dates dateright">06/28/25</a>
  </div>
  <svg class="background-svg" viewBox="0 0 1000 500" preserveAspectRatio="none" id="wires-svg">
    <!-- Lines generated by JS -->
  </svg>

  <div class="clock">
    <div class="digit-box" id="hour1"><span class="digit-text">0</span></div>
    <div class="digit-box" id="hour2"><span class="digit-text">0</span></div>
    <div class="digit-box" id="minute1"><span class="digit-text">0</span></div>
    <div class="digit-box" id="minute2"><span class="digit-text">0</span></div>
    <div class="digit-box" id="second1"><span class="digit-text">0</span></div>
    <div class="digit-box" id="second2"><span class="digit-text">0</span></div>
  </div>

  <script>
    const svg = document.getElementById('wires-svg');
    const colors = [
      "#c0c6c7", "#99a3a3", "#96431FFF", "#666666", "#333333", "#777777",
      "#444444", "#999999", "#888888", "#aaaaaa", "#bbbbbb", "#66615C",
      "#c0c6c7", "#99a3a3", "#894528FF", "#7E4930FF"
    ];

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    let lastLineUpdate = 0;
    const lineUpdateInterval = 5000; // Update lines every 5 seconds

    function drawLines() {
      const now = Date.now();
      if (now - lastLineUpdate < lineUpdateInterval && svg.children.length > 0) {
        // Subtle position adjustments for existing lines
        Array.from(svg.children).forEach((path, i) => {
          let startY, endY, controlY;
          const height = 500;
          const width = 1000;
          if (i < 50) {
            startY = randomInt(0, height * 0.2);
            endY = startY + randomInt(-6, 6);
            controlY = startY + randomInt(10, 40);
          } else if (i < 100) {
            startY = randomInt(height * 0.4, height * 0.6);
            endY = startY + randomInt(-6, 6);
            controlY = startY + randomInt(10, 40);
          } else {
            startY = randomInt(height * 0.2, height * 0.6); // 3/4 lines
            endY = startY + randomInt(-6, 6);
            controlY = startY + randomInt(10, 40);
          }
          const controlX = randomInt(width * 0.4, width * 0.6);
          const d = `M0 ${startY} Q${controlX} ${controlY} ${width} ${endY}`;
          path.setAttribute("d", d);
        });
        return;
      }

      // Full redraw only after interval
      svg.innerHTML = '';
      const totalLines = 150;
      const width = 1000;
      const height = 500;

      for (let i = 0; i < totalLines; i++) {
        let startY, endY, controlY;
        if (i < totalLines / 3) {
          startY = randomInt(0, height * 0.2);
          endY = startY + randomInt(-6, 6);
          controlY = startY + randomInt(10, 40);
        } else if (i < (2 * totalLines) / 3) {
          startY = randomInt(height * 0.4, height * 0.6);
          endY = startY + randomInt(-6, 6);
          controlY = startY + randomInt(10, 40);
        } else {
          startY = randomInt(height * 0.2, height * 0.6); // 3/4 lines
          endY = startY + randomInt(-6, 6);
          controlY = startY + randomInt(10, 40);
        }

        const controlX = randomInt(width * 0.4, width * 0.6);
        const d = `M0 ${startY} Q${controlX} ${controlY} ${width} ${endY}`;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("stroke", colors[i % colors.length]);
        path.setAttribute("stroke-width", 1 + (i % 3) * 0.5);
        path.setAttribute("fill", "none");
        path.classList.add("wire");

        svg.appendChild(path);
      }
      lastLineUpdate = now;
    }

    function updateClock() {
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');

      const digitBoxes = [
        { id: 'hour1', value: hours[0] },
        { id: 'hour2', value: hours[1] },
        { id: 'minute1', value: minutes[0] },
        { id: 'minute2', value: minutes[1] },
        { id: 'second1', value: seconds[0] },
        { id: 'second2', value: seconds[1] }
      ];

      digitBoxes.forEach(({ id, value }) => {
        const element = document.getElementById(id);
        const digitText = element.querySelector('.digit-text');
        if (digitText.textContent !== value) {
          digitText.classList.add('changing');
          setTimeout(() => {
            digitText.textContent = value;
            setTimeout(() => digitText.classList.remove('changing'), 300);
          }, 150); // Halfway through transition
        }
      });

      drawLines(); // Update lines (subtle adjustments or full redraw if needed)
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
