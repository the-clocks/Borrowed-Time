<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hospital Monitor Clock</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
    }

    .machine {
      background: #111;
      border: 1.5rem solid #333;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow:
        inset 0 0 60px #000,
        0 0 30px rgba(0,255,255,0.1),
        0 0 80px rgba(0,255,255,0.2);
      width: 80vw;
      max-width: 900px;
      height: 60vh;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .header, .footer {
      display: flex;
      justify-content: space-between;
      color: #0ff;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }

    .screen {
  background: #000 url('xray-skull.png') center/cover no-repeat;
  flex-grow: 1;
  margin: 1rem 0;
  border: 0.5rem solid #0ff;
  border-radius: 1rem;
  position: relative;
  box-shadow:
    0 0 15px #00ffff,
    inset 0 0 60px rgba(0,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}


    .clock {
      font-size: 8vw;
      color: #00ffff;
      text-shadow:
        0 0 4px #00ffff,
        0 0 12px #00ffff,
        0 0 24px #00ffff;
      animation: pulse 1s infinite;
      z-index: 2;
      position: relative;
    }

    /* Scanline flicker */
    .screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 255, 0.03),
        rgba(0, 255, 255, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      animation: flicker 0.3s infinite alternate;
      z-index: 1;
    }

    @keyframes flicker {
      from { opacity: 0.96; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.03);
        opacity: 0.75;
      }
    }

    /* Faux buttons and lights */
    .footer::after {
      content: "";
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .footer::after {
      content: "";
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
    }

    .light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #222;
      box-shadow: inset 0 0 3px #0ff;
    }

    .light.on {
      background: #0ff;
      box-shadow:
        0 0 5px #0ff,
        0 0 10px #0ff,
        0 0 20px #0ff;
    }
  </style>
</head>
<body>
  <div class="machine">
    <div class="header">
      <div>PATIENT: XR-0037</div>
      <div>SCAN MODE: TIMESTAMP</div>
    </div>

    <div class="screen">
      <div class="clock" id="clock">00:00:00</div>
    </div>

    <div class="footer">
      <div>STATUS: ONLINE</div>
      <div style="display: flex; gap: 0.5rem;">
        <div class="light on"></div>
        <div class="light"></div>
        <div class="light"></div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${h}:${m}:${s}`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
