<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hospital Monitor Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'xray';
      src: url('xray.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #494949;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
    }

    .machine {
      background: #575656;
      border: 1.5rem solid #9a9595;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow:
        inset 0 0 60px #000,
        0 0 30px rgba(0,255,255,0.1),
        0 0 80px rgba(0,255,255,0.2);
      width: 80vw;
      max-width: 900px;
      height: 60vh;
      max-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .screen {
      background: #000 url('./558074085193-ezgif.com-optiwebp-1.webp') center/cover no-repeat;
      flex-grow: 1;
      margin: 1rem 0;
      border: 0.3rem solid rgb(201, 204, 204);
      border-radius: 1rem;
      position: relative;
      box-shadow:
        0 0 15px #9ca1a1,
        inset 0 0 60px rgba(0,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .clock {
      display: flex;
      gap: 0.2rem;
      font-size: 5vw;
      font-family: 'xray', monospace;
      color: #c4c9c9;
      text-shadow:
        0 0 4px #ebf0f0,
        0 0 12px #151515,
        0 0 24px #c5caca;
      animation: pulse 1s infinite;
      z-index: 2;
      position: relative;
    }

    .digit {
      display: inline-block;
      min-width: 1ch;
      text-align: center;
    }

    .screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 255, 255, 0.03),
        rgba(0, 255, 255, 0.03) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      animation: flicker 0.3s infinite alternate;
      z-index: 1;
    }

    @keyframes flicker {
      from { opacity: 0.96; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.03);
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>
  <div class="machine">
    <div class="screen">
      <div class="clock" id="clock"></div>
    </div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const ms = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2); // Only first 2 digits
    const timeStr = `${h}:${m}:${s}.${ms}`;
    const clockContainer = document.getElementById('clock');
    clockContainer.innerHTML = '';
    for (let char of timeStr) {
      const span = document.createElement('span');
      span.className = 'digit';
      span.textContent = char;
      clockContainer.appendChild(span);
    }
  }

  setInterval(updateClock, 50);
  updateClock();
</script>

 
</body>
</html>
