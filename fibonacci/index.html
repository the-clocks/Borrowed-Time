<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fibonacci Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --clock-size: 0vh;
      --hand-hour-height: 10vh;
      --hand-minute-height: 19vh;
      --hand-second-height: 12vh;
      --number-font-size: 2.2rem;
      --number-translate-y: 32vh;
      --center-size: 3.9vh;
    }

    @font-face {
      font-family: 'fib';
      src: url('fib.ttf') format('truetype');
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background-color: #070606;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .clock {
      width: var(--clock-size);
      height: var(--clock-size);
      border-radius: 50%;
      position: relative;
      z-index: 3;
    }

    .number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center;
      font-family: 'fib';
      font-size: var(--number-font-size);
      color: #f1c72f;
      text-shadow: #0a233c 0.2rem 0.06rem;
    }

    .number div {
      position: absolute;
      transform: translate(-50%, calc(-1 * var(--number-translate-y)));
    }

     .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom;
      background-color: #f1c72f;
      filter: drop-shadow(0.2rem 0.06rem rgba(0, 0, 0, 1.0));
    }
        .hour-hand {
      width: 1vh;
      height: var(--hand-hour-height);
      border-radius: 0.4vh;
    }

    .minute-hand {
      width: 0.7vh;
      height: var(--hand-minute-height);
      border-radius: 0.3vh;
    }

    .second-hand {
      width: 0.25vh;
      height: var(--hand-second-height);
      background-color: transparent;
      border-radius: 0.2vh;
    }

    .center {
      width: var(--center-size);
      height: var(--center-size);
      /* background-color: #325a82; */
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: ;
    }

    .bgimage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150vmax;
      height: 150vmax;
      object-fit: cover;
      filter: contrast(0.3) brightness(1.6) saturate(0.2);
      z-index: 1;
      animation: slow-rotate 60s linear infinite;
      transform-origin: center center;
    }

    @keyframes slow-rotate {
      0% {
        transform: translate(-50%, -50%) scale(-1, -1) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -50%) scale(-1, -1) rotate(-360deg);
      }
    }

    .date-container, .title-container {
      position: fixed;
      width: 98%;
      z-index: 10;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      color: #12172a;
    }

    .date-container {
      bottom: 0.5vh;
    }

    .title-container {
      top: 0.5vh;
      color: #bebdbd;
      text-shadow: #4e4e4c 0.06rem 0;
    }

    .clockname {
      font-family: "Oxanium", serif;
      font-size: 4vh;
      line-height: 4vh;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
    }

    .chltitle {
      font-family: "Roboto Slab", serif;
      font-size: 2.8vh;
      position: absolute;
      top: 0.2vh;
      right: 0.5vh;
      letter-spacing: 0.1vh;
    }

    .bttitle {
      font-family: "Oxanium", serif;
      font-size: 2.8vh;
      font-style: italic;
      letter-spacing: -0.1vh;
      position: relative;
      left: 0;
      z-index: 15;
    }

    .dateleft, .dateright {
      font-family: "Nanum Gothic Coding", monospace;
      font-size: 3vh;
    }

    .dateleft {
      position: relative;
      left: 0;
    }

    .dateright {
      position: absolute;
      right: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #e8ecec;
      background-color: rgb(21, 0, 255);
    }
  </style>
</head>
<body>
  <div class="title-container">
    <div class="chltitle">Cubist Heart Laboratories</div>
    <div class="bttitle">BorrowedTime</div>
  </div>

  <div class="date-container">
    <a href="../penmanship/" class="dates dateleft">07/11/25</a>
    <a href="../index.html" class="clockname">Fibonacci</a>
    <a href="../index.html" class="dates dateright">07/13/25</a>
  </div>

  <img src="./fib.gif" class="bgimage">
  <div class="clock">
    <div class="number" style="transform: rotate(30deg);"><div>0</div></div>
    <div class="number" style="transform: rotate(60deg);"><div>1</div></div>
    <div class="number" style="transform: rotate(90deg);"><div>1</div></div>
    <div class="number" style="transform: rotate(120deg);"><div>2</div></div>
    <div class="number" style="transform: rotate(150deg);"><div>3</div></div>
    <div class="number" style="transform: rotate(180deg);"><div>5</div></div>
    <div class="number" style="transform: rotate(210deg);"><div>8</div></div>
    <div class="number" style="transform: rotate(240deg);"><div>13</div></div>
    <div class="number" style="transform: rotate(270deg);"><div>21</div></div>
    <div class="number" style="transform: rotate(300deg);"><div>34</div></div>
    <div class="number" style="transform: rotate(330deg);"><div>55</div></div>
    <div class="number" style="transform: rotate(0deg);"><div>89</div></div>

    <div class="hand hour-hand"></div>
    <div class="hand minute-hand"></div>
    <div class="hand second-hand"></div>
    <div class="center"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      const secondDeg = (seconds / 60) * 360;
      const minuteDeg = (minutes / 60) * 360 + (seconds / 60) * 6;
      const hourDeg = (hours / 12) * 360 + (minutes / 60) * 30;

      document.querySelector('.second-hand').style.transform = `rotate(${secondDeg}deg)`;
      document.querySelector('.minute-hand').style.transform = `rotate(${minuteDeg}deg)`;
      document.querySelector('.hour-hand').style.transform = `rotate(${hourDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
