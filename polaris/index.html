<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Polaris Clock </title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
  <style>
    @font-face {
      font-family: 'pol';
      src: url('./pol.otf') format('opentype');
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: rgb(11, 11, 139);
    }

    @keyframes slow-rotate {
      0% { transform: rotate(0deg) scale(1.5); }
      100% { transform: rotate(360deg) scale(1.5); }
    }

    .bgimage {
  position: absolute;
  filter: brightness(100%) saturate(900%);
  /* top: 1%; */
  /* left: 50%; */
  width: 50%;
  height: 50%;
  z-index: 9;
  animation: slow-rotate 60s linear infinite;
  transform: translate(-50%, -50%) rotate(0deg);
  transform-origin: center center;
}


    .clock {
      position: relative;
      left: -3px;
      top: 3px;
      width: 88vmin;
      height: 80vmin;
      border-radius: 50%;
      z-index: 2;
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: rotate(0deg);
      pointer-events: none;
      z-index: 6;
    }

    .hour-hand {
      width: 0.3rem;
      height: 30%;
      background-color: #b4b6bc;
      border-radius: 4.8rem;
    }

    .minute-hand {
      width: 0.2rem;
      height: 45%;
      background-color: #c9d7f4;
      border-radius: 4.3rem;
    }

   .number {
  position: absolute;
  font-family: 'pol';
  font-size: 3.2rem;
  color: rgb(42, 71, 161);
  text-shadow: #aeb3b3 -1px 0px;
  width: 2.2rem;
  height: 2.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: translate(-50%, -50%);
}


        .title-container {
            color: #383536;
            text-shadow: #cdbfc8 1px 0px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.1vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.2vh;
            font-style: italic;
            letter-spacing: -0.1vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
            text-decoration: none;
        }

        .date-container {
            color: #b9b6b5;
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            z-index: 6;
        }

        .clockname {
            font-family: "Oxanium", serif;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: relative;
            left: 0;
        }

        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: absolute;
            right: 0;
        }
    </style>
</head>

<body>
    <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>
    <div class="date-container">
        <a href="../vegas/" class="dates dateleft">07/05/25</a>
        <a href="../index.html" class="clockname">Polaris</a>
      <a href="../index.html"  class="dates dateright">07/07/25</a>
    </div>
  <img src="./polaris.gif" class="bgimage">
  <div class="clock">
    <div class="hand hour-hand"></div>
    <div class="hand minute-hand"></div>
    <div class="hand second-hand"></div>

    <!-- Clock Numbers -->
    <div class="number" style="top: 10%; left: 50%;">12</div>
    <div class="number" style="top: 18%; left: 76%;">1</div>
    <div class="number" style="top: 34%; left: 89%;">2</div>
    <div class="number" style="top: 50%; left: 94%;">3</div>
    <div class="number" style="top: 66%; left: 89%;">4</div>
    <div class="number" style="top: 82%; left: 76%;">5</div>
    <div class="number" style="top: 90%; left: 50%;">6</div>
    <div class="number" style="top: 82%; left: 24%;">7</div>
    <div class="number" style="top: 66%; left: 11%;">8</div>
    <div class="number" style="top: 50%; left: 6%;">9</div>
    <div class="number" style="top: 34%; left: 11%;">10</div>
    <div class="number" style="top: 18%; left: 24%;">11</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secDeg = seconds * 6;
      const minDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = (hours % 12) * 30 + minutes * 0.5;

      document.querySelector('.second-hand').style.transform = `rotate(${secDeg}deg)`;
      document.querySelector('.minute-hand').style.transform = `rotate(${minDeg}deg)`;
      document.querySelector('.hour-hand').style.transform = `rotate(${hourDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
