<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Monofett&family=Nanum+Gothic+Coding:wght@400;700&family=Oxanium:wght@200..800&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* background-color:#6A7A82FF; */
        }
        canvas {
             z-index: 3;
            /* border: 1px solid #707c7c; */
            border-radius: 50%;
            /* background-color: #738282; */
        }
        .title-container {
            color: #646461;
            text-shadow: #dddad6 1px 0px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            /* justify-content: space-between; */
            z-index: 6;
        }

        .chltitle {
            font-family: "Roboto Slab", serif;
            font-size: 2.8vh;
            position: absolute;
            top: 1px;
            right: 1px;
            letter-spacing: 0.1vh;
        }

        .bttitle {
            position: relative;
            left: 0;
            font-family: "Oxanium", serif;
            font-size: 2.8vh;
            font-style: italic;
            z-index: 15;
            letter-spacing: -0.1vh;
        }

     

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: #e8ecec;
            background-color: rgb(21, 0, 255);
            text-decoration: none;
        }

        .date-container {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 98%;
            display: flex;
            /* justify-content: space-between; */
            z-index: 6;
        }

        .clockname {
            font-family: "Oxanium", serif;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            font-size: 4vh;
            line-height: 4vh;
        }

        .dateleft {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: relative;
            left: 0;
        }

        .dateright {
            font-size: 3vh;
            font-family: "Nanum Gothic Coding", monospace;
            position: absolute;
            right: 0;
        }
        .bgimage {
            position: absolute;
            top: 0;
            left: 0;
            width: 102%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: contrast(60%);
        }
    </style>
</head>

<body>

   <img src="./em.png" class="bgimage">
  <div class="title-container">
        <div class="chltitle">Cubist Heart Laboratories</div>
        <div class="bttitle">BorrowedTime</div>
    </div>

     <div class="date-container">
        <a href="../baybayin/" class="dates dateleft">07/23/25</a>
        <a href="../index.html" class="clockname">Emojis</a>
          <a href="../index.html" class="dates dateright">07/25/25</a>
    </div>
  </div>

    <canvas id="clock" width="300vw" height="300vw"></canvas>
    <script>
        const canvas = document.getElementById('clock');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        // Array of Roman numerals for hours 1-12
        const hourNumbers = ['🎄', '🥇', '✌️', '🎶', '🍀', '⭐', '🀞', '🎰', '🎱', '🐈', '🎯', '⏸️'];

        function drawClock() {
            const now = new Date(); // Use current system time
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(radius, radius);

            // Draw clock face
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.9, 0, 2 * Math.PI);
            ctx.fillStyle = 'transparent'; // Make the clock face transparent
            ctx.fill();
            ctx.strokeStyle = 'transparent';
            ctx.lineWidth = 0;
            ctx.stroke();

            // Draw hour markers and Roman numerals
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * Math.PI / 180;
                // // Hour markers
                // ctx.beginPath();
                // ctx.moveTo(0, -radius * 0.8);
                // ctx.lineTo(0, -radius * 0.9);
                // ctx.lineWidth = 2;
                // ctx.stroke();
                // Roman numerals
                ctx.save();
                ctx.translate(0, -radius * 0.75);
                ctx.rotate(-angle); // Counter-rotate to keep numbers upright
                ctx.font = '52px Times New Roman'; // Use Times New Roman for Roman numerals
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'black';
                ctx.fillText(hourNumbers[i], 0, 0);
                ctx.restore();
                ctx.rotate(30 * Math.PI / 180);
            }

            // Get time
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Draw hour hand
            ctx.save();
            ctx.rotate((hours + minutes / 60 + seconds / 3600) * 30 * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -radius * 0.4);
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.restore();

            // Draw minute hand
            ctx.save();
            ctx.rotate((minutes + seconds / 60 + milliseconds / 60000) * 6 * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -radius * 0.6);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.restore();

            // Draw second hand
            ctx.save();
            ctx.rotate((seconds + milliseconds / 1000) * 6 * Math.PI / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -radius * 0.9);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.restore();

            // Draw center dot
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();

            ctx.restore();
        }

        // Update clock every 50ms for smoother second hand movement
        setInterval(drawClock, 50);
        drawClock(); // Initial draw
    </script>
</body>
</html>
