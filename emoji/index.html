<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analog Clock with Images</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock {
      position: relative;
      width: 60vmin;
      height: 60vmin;
    }

    .num {
      position: absolute;
      width: 10%;
      transform: translate(-50%, -50%);
    }

    .n1  { top: 15%; left: 75%; }
    .n2  { top: 27%; left: 85%; }
    .n3  { top: 50%; left: 90%; }
    .n4  { top: 73%; left: 85%; }
    .n5  { top: 85%; left: 73%; }
    .n6  { top: 90%; left: 50%; }
    .n7  { top: 85%; left: 27%; }
    .n8  { top: 73%; left: 15%; }
    .n9  { top: 50%; left: 10%; }
    .n10 { top: 27%; left: 15%; }
    .n11 { top: 15%; left: 27%; }
    .n12 { top: 10%; left: 50%; }

    .hand {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: 10% 50%;
      transform: rotate(0deg);
      pointer-events: none;
    }

    .hand img {
      height: 2vmin;
      width: 30vmin;
    }

    .hand.hour img {
      width: 20vmin;
    }

    .hand.minute img {
      width: 27vmin;
    }

    .hand.second img {
      width: 30vmin;
    }
  </style>
</head>
<body>
  <div class="clock">
    <!-- Number images -->
    <img src="images/num1.png" class="num n1" />
    <img src="images/num2.png" class="num n2" />
    <img src="images/num3.png" class="num n3" />
    <img src="images/num4.png" class="num n4" />
    <img src="images/num5.png" class="num n5" />
    <img src="images/num6.png" class="num n6" />
    <img src="images/num7.png" class="num n7" />
    <img src="images/num8.png" class="num n8" />
    <img src="images/num9.png" class="num n9" />
    <img src="images/num10.png" class="num n10" />
    <img src="images/num11.png" class="num n11" />
    <img src="images/num12.png" class="num n12" />

    <!-- Hands -->
    <div class="hand hour"><img src="images/hour.png" alt="hour" /></div>
    <div class="hand minute"><img src="images/minute.png" alt="minute" /></div>
    <div class="hand second"><img src="images/second.png" alt="second" /></div>
  </div>

  <script>
    const hourHand = document.querySelector('.hour');
    const minuteHand = document.querySelector('.minute');
    const secondHand = document.querySelector('.second');

    function updateClock() {
      const now = new Date();
      const sec = now.getSeconds();
      const min = now.getMinutes();
      const hr = now.getHours() % 12;

      const secDeg = sec * 6;
      const minDeg = min * 6 + sec * 0.1;
      const hrDeg = hr * 30 + min * 0.5;

      hourHand.style.transform = `rotate(${hrDeg}deg)`;
      minuteHand.style.transform = `rotate(${minDeg}deg)`;
      secondHand.style.transform = `rotate(${secDeg}deg)`;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
